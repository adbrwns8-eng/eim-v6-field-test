<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Inspection</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:white;font-weight:700}.yellow{background:#fff4cc}.red{background:#ffe0e0}.green{background:#e7f7eb}.small{font-size:13px;color:#667085}.mode{font-weight:800;color:#475467}</style></head><body><main><button onclick="home()">← EIM HOME</button><h1 id="title">Inspection</h1><p id="modeText" class="mode"></p><div id="login" class="card"><input id="pin" inputmode="numeric" placeholder="Employee PIN"><button id="go">CONTINUE</button><p id="msg"></p></div><div id="form" class="card hidden"><h2 id="hello"></h2><label id="assetLabel">Equipment / Vehicle</label><select id="equipment"></select><label>Condition / deficiency</label><textarea id="description" rows="6" placeholder="Describe what you found, where it is, and why it concerns you."></textarea><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="submit">SUBMIT</button><p id="submitMsg"></p></div><div id="result" class="card hidden"><h2 id="severity"></h2><p id="instruction"></p><button id="ack">I UNDERSTAND</button></div><div id="done" class="card green hidden"><h2>✓ Submitted</h2><p>The finding and your acknowledgement were recorded.</p><button onclick="home()">RETURN HOME</button></div></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',K='eimPilotPin',q=new URLSearchParams(location.search),mode=q.get('mode')||'vehicle';let emp,fid;const $=x=>document.getElementById(x);const labels={vehicle:['Equipment / Vehicle Inspection','Select the mobile equipment or vehicle being inspected.','Mobile Equipment / Vehicle'],plant:['Plant / Area Inspection','Select the plant equipment or area inspection point.','Plant Equipment / Area'],problem:['Report a Problem','Report a condition outside a scheduled inspection.','Equipment / Area']};const L=labels[mode]||labels.vehicle;$('title').textContent=L[0];$('modeText').textContent=L[1];$('assetLabel').textContent=L[2];function home(){const p=sessionStorage.getItem(K)||$('pin').value.trim();location.href='./?v=13.5&pin='+encodeURIComponent(p)}async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d?.error||t);return d}async function start(){try{const p=$('pin').value.trim();let d=await api('login',{pin:p});emp=Array.isArray(d)?d[0]:d;if(!emp)throw Error('PIN not recognized');sessionStorage.setItem(K,p);const endpoint=mode==='vehicle'?'vehicle_equipment':'equipment',r=await fetch(A+'?a='+endpoint),eq=await r.json();if(!r.ok)throw Error(eq?.error||'Could not load inspection assets');$('equipment').innerHTML='<option value="">Select...</option>'+eq.map(x=>`<option value="${x.id}">${x.equipment_id} — ${x.description}</option>`).join('');$('hello').textContent='Hello, '+emp.name;$('login').classList.add('hidden');$('form').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}$('go').onclick=start;$('submit').onclick=async()=>{if(!$('equipment').value)return $('submitMsg').textContent='Select equipment.';if(!$('description').value.trim())return $('submitMsg').textContent='Describe the condition.';if(!$('photo').files.length)return $('submitMsg').textContent='Add a photo.';if(mode==='vehicle')return $('submitMsg').textContent='Vehicle inspection asset selected correctly. Full mobile-equipment inspection checklist submission is the next test step; plant findings will not be used for this vehicle inspection.';try{const d=await api('submit',{employee_id:emp.employee_id||emp.id,equipment_id:$('equipment').value,description:$('description').value.trim(),photo_note:$('photo').files[0].name});fid=d.finding_id;$('form').classList.add('hidden');$('result').classList.remove('hidden');$('result').classList.add(d.instruction_level);$('severity').textContent=(d.instruction_level||'').toUpperCase()+' — '+(d.severity||'').toUpperCase();$('instruction').textContent=d.instruction}catch(e){$('submitMsg').textContent=e.message}};$('ack').onclick=async()=>{try{await api('ack',{finding_id:fid});$('result').classList.add('hidden');$('done').classList.remove('hidden')}catch(e){alert(e.message)}};const p=q.get('pin')||sessionStorage.getItem(K);if(p){$('pin').value=p;setTimeout(start,50)}</script></body></html>
