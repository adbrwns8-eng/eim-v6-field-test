<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Inspection</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:white;font-weight:700}.secondary{background:#475467}.yellow{background:#fff4cc}.red{background:#ffe0e0}.green{background:#e7f7eb}.small{font-size:13px;color:#667085}.mode{font-weight:800;color:#475467}.item{border-top:1px solid #eaecf0;padding:14px 0}.item:first-child{border-top:0}.item h3{margin:0 0 8px}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.choices button{margin:0;background:#fff;color:#17202a}.choices button.selected{background:#17202a;color:#fff}.def{margin-top:10px;padding:12px;background:#fff4cc;border-radius:10px}.progress{font-weight:800}.asset{font-weight:800;font-size:18px}</style></head><body><main><button onclick="location.href='./'">← EIM HOME</button><h1 id="title">Inspection</h1><p id="modeText" class="mode"></p><div id="login" class="card"><input id="pin" inputmode="numeric" placeholder="Employee PIN"><button id="go">CONTINUE</button><p id="msg"></p></div><div id="selectCard" class="card hidden"><h2 id="hello"></h2><label id="assetLabel">Equipment / Vehicle</label><select id="equipment"></select><button id="begin">BEGIN INSPECTION</button><p id="selectMsg"></p></div><div id="vehicleChecklist" class="card hidden"><div id="vehicleName" class="asset"></div><p class="small">Mark every item PASS, DEFICIENT, or N/A. Every deficiency requires a description and photo.</p><div id="checklist"></div><button id="finishVehicle">FINISH INSPECTION</button><p id="vehicleMsg"></p></div><div id="findingForm" class="card hidden"><h2>Report Condition / Deficiency</h2><label>Condition / deficiency</label><textarea id="description" rows="6" placeholder="Describe what you found, where it is, and why it concerns you."></textarea><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="submit">SUBMIT</button><p id="submitMsg"></p></div><div id="result" class="card hidden"><h2 id="severity"></h2><p id="instruction"></p><button id="ack">I UNDERSTAND</button></div><div id="done" class="card green hidden"><h2>✓ Submitted</h2><p id="doneText">The inspection was recorded.</p><button onclick="location.href='./'">RETURN HOME</button></div></main><script src="b23-workflow-client.js?v=23"></script><script src="inspection-v23.js?v=23"></script></body></html>
