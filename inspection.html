<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Inspection</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:white;font-weight:700}.secondary{background:#475467}.yellow{background:#fff4cc}.red{background:#ffe0e0}.green{background:#e7f7eb}.small{font-size:13px;color:#667085}.mode{font-weight:800;color:#475467}.item{border-top:1px solid #eaecf0;padding:14px 0}.item:first-child{border-top:0}.item h3{margin:0 0 8px}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.choices button{margin:0;background:#fff;color:#17202a}.choices button.selected{background:#17202a;color:#fff}.def{margin-top:10px;padding:12px;background:#fff4cc;border-radius:10px}.progress{font-weight:800}.asset{font-weight:800;font-size:18px}</style></head><body><main><button onclick="home()">← EIM HOME</button><h1 id="title">Inspection</h1><p id="modeText" class="mode"></p><div id="login" class="card"><input id="pin" inputmode="numeric" placeholder="Employee PIN"><button id="go">CONTINUE</button><p id="msg"></p></div><div id="selectCard" class="card hidden"><h2 id="hello"></h2><label id="assetLabel">Equipment / Vehicle</label><select id="equipment"></select><button id="begin">BEGIN INSPECTION</button><p id="selectMsg"></p></div><div id="vehicleChecklist" class="card hidden"><div id="vehicleName" class="asset"></div><p class="small">Mark every item PASS, DEFICIENT, or N/A. Every deficiency requires a description and photo.</p><div id="checklist"></div><button id="finishVehicle">FINISH INSPECTION</button><p id="vehicleMsg"></p></div><div id="findingForm" class="card hidden"><h2>Report Condition / Deficiency</h2><label>Condition / deficiency</label><textarea id="description" rows="6" placeholder="Describe what you found, where it is, and why it concerns you."></textarea><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="submit">SUBMIT</button><p id="submitMsg"></p></div><div id="result" class="card hidden"><h2 id="severity"></h2><p id="instruction"></p><button id="ack">I UNDERSTAND</button></div><div id="done" class="card green hidden"><h2>✓ Submitted</h2><p id="doneText">The inspection was recorded.</p><button onclick="home()">RETURN HOME</button></div></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',K='eimPilotPin',q=new URLSearchParams(location.search),mode=q.get('mode')||'vehicle';let emp,fid,eqList=[],answers={};const $=x=>document.getElementById(x);const labels={vehicle:['Equipment / Vehicle Inspection','Select the mobile equipment or vehicle being inspected.','Mobile Equipment / Vehicle'],plant:['Plant / Area Inspection','Select the plant equipment or area inspection point.','Plant Equipment / Area'],problem:['Report a Problem','Report a condition outside a scheduled inspection.','Equipment / Area']};const vehicleItems=['Lights / Reflectors','Steps / Access Points','Handrails / Grab Handles','Fenders / Body Condition','Mirrors / Windows / Visibility','Tires / Wheels / Tracks','Fluid Levels / Leaks','Hydraulic Hoses / Lines','Brakes / Parking Brake','Steering / Controls','Horn / Backup Alarm','Seat Belt / Operator Restraint','Fire Extinguisher','Guards / Shields','Attachments / Couplers','General Housekeeping / Cab'];const L=labels[mode]||labels.vehicle;$('title').textContent=L[0];$('modeText').textContent=L[1];$('assetLabel').textContent=L[2];function home(){const p=sessionStorage.getItem(K)||$('pin').value.trim();location.href='./?v=14&pin='+encodeURIComponent(p)}async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d?.error||t);return d}async function start(){try{const p=$('pin').value.trim();let d=await api('login',{pin:p});emp=Array.isArray(d)?d[0]:d;if(!emp)throw Error('PIN not recognized');sessionStorage.setItem(K,p);const endpoint=mode==='vehicle'?'vehicle_equipment':'equipment',r=await fetch(A+'?a='+endpoint),eq=await r.json();if(!r.ok)throw Error(eq?.error||'Could not load inspection assets');eqList=eq;$('equipment').innerHTML='<option value="">Select...</option>'+eq.map(x=>`<option value="${x.id}">${x.equipment_id} — ${x.description}</option>`).join('');$('hello').textContent='Hello, '+emp.name;$('login').classList.add('hidden');$('selectCard').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}function renderChecklist(){answers={};$('checklist').innerHTML=vehicleItems.map((x,i)=>`<div class="item" data-i="${i}"><h3>${i+1}. ${x}</h3><div class="choices"><button type="button" data-v="pass">PASS</button><button type="button" data-v="deficient">DEFICIENT</button><button type="button" data-v="na">N/A</button></div><div class="def hidden"><textarea rows="3" class="dtext" placeholder="Describe the deficiency..."></textarea><label>Required photo</label><input class="dphoto" type="file" accept="image/*" capture="environment"></div></div>`).join('');document.querySelectorAll('.item').forEach(row=>row.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{row.querySelectorAll('.choices button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const i=+row.dataset.i;answers[i]=b.dataset.v;row.querySelector('.def').classList.toggle('hidden',b.dataset.v!=='deficient')}))}$('begin').onclick=()=>{if(!$('equipment').value)return $('selectMsg').textContent='Select equipment or vehicle.';if(mode==='vehicle'){const e=eqList.find(x=>String(x.id)===String($('equipment').value));$('vehicleName').textContent=(e?.equipment_id||'')+' — '+(e?.description||'');renderChecklist();$('selectCard').classList.add('hidden');$('vehicleChecklist').classList.remove('hidden')}else{$('selectCard').classList.add('hidden');$('findingForm').classList.remove('hidden')}};$('finishVehicle').onclick=async()=>{const missing=vehicleItems.findIndex((_,i)=>!answers[i]);if(missing>=0)return $('vehicleMsg').textContent='Complete item '+(missing+1)+': '+vehicleItems[missing]+'.';const defs=[];for(let i=0;i<vehicleItems.length;i++){if(answers[i]==='deficient'){const row=document.querySelector(`.item[data-i="${i}"]`),text=row.querySelector('.dtext').value.trim(),file=row.querySelector('.dphoto').files[0];if(!text)return $('vehicleMsg').textContent='Describe the deficiency for '+vehicleItems[i]+'.';if(!file)return $('vehicleMsg').textContent='Add the required photo for '+vehicleItems[i]+'.';defs.push({i,text,file})}}const b=$('finishVehicle');b.disabled=true;b.textContent='SUBMITTING...';try{for(const d of defs){const text=vehicleItems[d.i]+': '+d.text;const r=await api('submit',{employee_id:emp.employee_id||emp.id,equipment_id:$('equipment').value,description:text,photo_note:d.file.name});if(r.finding_id)await api('ack',{finding_id:r.finding_id})}$('vehicleChecklist').classList.add('hidden');$('done').classList.remove('hidden');$('doneText').textContent=defs.length?`Inspection complete. ${defs.length} deficiency finding(s) were recorded.`:'Inspection complete. All checklist items passed or were marked N/A.'}catch(e){$('vehicleMsg').textContent='Inspection could not be completed: '+e.message;b.disabled=false;b.textContent='FINISH INSPECTION'}};$('go').onclick=start;$('submit').onclick=async()=>{if(!$('description').value.trim())return $('submitMsg').textContent='Describe the condition.';if(!$('photo').files.length)return $('submitMsg').textContent='Add a photo.';try{const d=await api('submit',{employee_id:emp.employee_id||emp.id,equipment_id:$('equipment').value,description:$('description').value.trim(),photo_note:$('photo').files[0].name});fid=d.finding_id;$('findingForm').classList.add('hidden');$('result').classList.remove('hidden');$('result').classList.add(d.instruction_level);$('severity').textContent=(d.instruction_level||'').toUpperCase()+' — '+(d.severity||'').toUpperCase();$('instruction').textContent=d.instruction}catch(e){$('submitMsg').textContent=e.message}};$('ack').onclick=async()=>{try{await api('ack',{finding_id:fid});$('result').classList.add('hidden');$('done').classList.remove('hidden')}catch(e){alert(e.message)}};const p=q.get('pin')||sessionStorage.getItem(K);if(p){$('pin').value=p;setTimeout(start,50)}</script></body></html>
