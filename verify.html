<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Verification Queue</title><style>body{font-family:Arial;background:#f4f6f8;color:#17202a;margin:0}main{max-width:820px;margin:auto;padding:18px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border:1px solid #b8c0cc;border-radius:9px}button{background:#17202a;color:#fff;font-weight:bold}.approve{background:#176b3a}.reject{background:#9b1c1c}.home{width:auto;padding:10px 16px}.hidden{display:none}.small{color:#667085;font-size:13px}.badge{display:inline-block;padding:5px 9px;background:#fff4cc;border-radius:20px;font-weight:bold}.item{border-left:5px solid #667085;padding-left:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.actions{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>ENERGY IN MOTION</h1><b style="color:#9b1c1c">INDEPENDENT VERIFICATION</b></div><button class="home" onclick="goHome()">HOME</button></div><section id="login" class="card"><h2>Manager Access</h2><input id="pin" inputmode="numeric" placeholder="Manager PIN"><button onclick="login()">OPEN VERIFICATION QUEUE</button><p id="msg" class="small">For this test use PIN 2222.</p></section><section id="app" class="hidden"><div class="card"><h2 id="hello"></h2><p class="small">Only corrective actions completed by another manager are shown here.</p></div><div id="queue"></div></section><script>const API='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';let mgr=null,busy=false;const $=x=>document.getElementById(x);async function post(a,b){const r=await fetch(API+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goHome(){location.href='./?v=17'}async function login(){try{$('msg').textContent='Checking access...';const d=await post('login',{pin:$('pin').value.trim()}),u=Array.isArray(d)?d[0]:d;if(!u||u.access_level!=='manager')throw Error('Manager PIN required');mgr={id:u.employee_id,name:u.name};$('hello').textContent='Hello, '+mgr.name;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('msg').textContent=e.message}}async function load(){try{const d=await post('verification_queue',{manager_id:mgr.id}),rows=Array.isArray(d)?d:(d.items||d.queue||[]);if(!rows.length){$('queue').innerHTML='<div class="card"><h2>No Items Awaiting Verification</h2><p>There are currently no independently routed corrective actions waiting for you.</p></div>';return}$('queue').innerHTML=rows.map((r,i)=>'<div class="card item"><span class="badge">VERIFICATION REQUIRED</span><h2>Finding #'+esc(r.finding_no)+'</h2><p><b>Equipment:</b> '+esc(r.equipment_code)+' — '+esc(r.equipment_description)+'</p><p><b>Original deficiency:</b><br>'+esc(r.description)+'</p><p><b>Current severity:</b> '+esc(r.current_severity)+'</p><p><b>Corrective work completed by:</b> '+esc(r.completed_by_name)+'</p><p><b>Repair / completion description:</b><br>'+esc(r.completion_comment)+'</p><p><b>Equipment / area status:</b> '+esc(r.equipment_status)+'</p><p><b>After Repair evidence:</b> '+esc(r.evidence_file_name||'Evidence record on file')+'</p><label>Verification comment</label><textarea id="c'+i+'" rows="3" placeholder="Document what you verified. Required if rejecting."></textarea><div class="actions"><button class="approve" onclick="decide(\''+r.corrective_action_id+'\',\'approved\','+i+')">APPROVE & CLOSE</button><button class="reject" onclick="decide(\''+r.corrective_action_id+'\',\'rejected\','+i+')">REJECT — RETURN FOR REWORK</button></div><p id="m'+i+'" class="small"></p></div>').join('')}catch(e){$('queue').innerHTML='<div class="card"><b>Could not load queue:</b> '+esc(e.message)+'</div>'}}async function decide(id,decision,i){if(busy)return;const comment=$('c'+i).value.trim();if(decision==='rejected'&&!comment){$('m'+i).textContent='Rejection reason is required.';return}if(!confirm(decision==='approved'?'Approve this repair and close the finding?':'Reject this repair and return it for corrective rework?'))return;try{busy=true;$('m'+i).textContent='Recording verification...';await post('verify_corrective',{manager_id:mgr.id,corrective_action_id:id,decision,comment});$('m'+i).textContent=decision==='approved'?'✓ Verification approved. Finding closed.':'✓ Verification rejected. Finding returned for rework.';setTimeout(load,700)}catch(e){$('m'+i).textContent=e.message}finally{busy=false}}</script></main></body></html>
