<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BOS EIM Onboarding Pilot</title><link rel="stylesheet" href="onboarding-pilot.css"><script defer src="onboarding-pilot.js"></script></head>
<body><header><h1>BOS · EIM onboarding</h1><p>TEST ONLY · Does not issue official certificates or authorize work</p></header><main>
<section id="login"><h2>Sign in to the training pilot</h2><p>Use your existing pilot PIN. Each employee and trainer signs in separately.</p><form id="login-form"><label for="pin">Employee PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required autocomplete="off"><button type="submit">Sign in</button></form><p class="muted">No PINs in links. Test records are stored separately from existing inspections.</p></section>
<section id="workspace" hidden><div class="toolbar"><p id="who"></p><button id="refresh" class="secondary">Refresh records</button><button id="logout" class="secondary">Sign out / switch person</button></div><nav aria-label="Onboarding navigation"><button id="overview" class="secondary">Employee records</button><button id="new-session" hidden>New training session</button></nav><div id="view"></div></section>
<p id="message" role="status" aria-live="polite"></p></main></body></html>
