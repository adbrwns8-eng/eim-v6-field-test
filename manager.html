<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build 23 Management</title>
<style>body{font:16px Arial;background:#f4f6f8;color:#17202a;margin:0}main{max-width:800px;margin:auto;padding:20px}section,article{background:white;padding:18px;margin:12px 0;border:1px solid #d0d5dd;border-radius:12px}input,textarea,select,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:6px 0}button{background:#17202a;color:white;cursor:pointer}button:disabled{opacity:.5}img{max-width:100%;height:auto}#restriction{font-weight:bold;color:#9b1c1c}[hidden]{display:none!important}</style></head>
<body><main><a href="./">EIM Home</a><h1>Build 23 Management</h1><p>Plant Manager and Rotation Manager · authorized facilities only</p>
<section id="login"><label>Employee PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><button id="signin">Sign in</button></section>
<section id="workspace" hidden><h2 id="who"></h2><p>Action Required: <strong id="count">—</strong></p><button id="refresh">Refresh</button><button id="logout">Sign out</button><h2>Submitted Inspections</h2><div id="inspections"></div><h2>Facility Findings</h2><p id="legacy-warning" role="status"></p><div id="queue"></div></section>
<section id="detail" hidden><h2 id="finding-title"></h2><p id="facility"></p><p id="finding-text"></p><p id="restriction"></p><p id="state"></p><button id="ack" hidden>Acknowledge management responsibility</button>
<div id="assignment" hidden><h3>Assignment and routing</h3><label>Responsible manager<select id="assignee"></select></label><button id="assign">Assign / route</button></div>
<label>Planned start<input id="starts" type="datetime-local"></label><label>Deadline<input id="due" type="datetime-local"></label>
<div id="planning" hidden><label>Immediate controls<textarea id="controls"></textarea></label><label>Action plan<textarea id="plan"></textarea></label><button id="save-plan">Save plan and deadline</button></div>
<div id="commenting" hidden><label>Manager comment<textarea id="comment"></textarea></label><button id="comment-save">Save comment</button></div><div id="comments"></div>
<div id="completion" hidden><label>After Repair photo<input id="photo" type="file" accept="image/png,image/jpeg"></label><label>Photographer<input id="taken-by"></label><label>Photo note<textarea id="photo-note"></textarea></label><button id="upload">Save After Repair photo</button><label>Repair description<textarea id="completion-text"></textarea></label><button id="complete">Submit for independent verification</button></div>
<div id="photos"></div><div id="verification" hidden><label>Verification comment<textarea id="verification-comment"></textarea></label><button id="approve">Approve and close</button><button id="reject">Reject for rework</button></div><h3>Audit history</h3><ul id="history"></ul></section>
<p id="status" role="status" aria-live="polite"></p></main><script src="b23-workflow-client.js?v=23"></script><script src="manager-v23.js?v=23"></script></body></html>
