<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Management</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:760px;margin:auto;padding:20px}.card,.item{background:white;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none!important}input,textarea,select,button{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:white;font-weight:700}.secondary{background:#475467}.danger{background:#b42318}.pending,.verify{border-left:5px solid #b54708}.redfinding{border:2px solid #b42318;border-left:8px solid #b42318;background:#fff7f6}.redtext{color:#b42318;font-weight:800}.notice{background:#fff7ed;padding:12px;border-radius:10px}.small{font-size:13px;color:#667085}</style></head><body><main><button onclick="location.href='./'">← EIM HOME</button><h1>Management</h1><section id="login" class="card"><input id="pin" inputmode="numeric" placeholder="PIN"><button id="loginBtn">CONTINUE</button><p id="msg"></p></section><section id="mgr" class="hidden"><div class="card"><h2 id="who"></h2><button id="refresh" class="secondary">REFRESH</button><h3>My Findings</h3><div id="queue"></div><h3>Awaiting My Verification</h3><div id="verifyQueue"></div></div><div id="detail" class="card hidden"><button id="back" class="secondary">← MANAGEMENT QUEUE</button><h2>Finding Detail</h2><div id="detailText"></div><button id="takeRedBtn" class="danger hidden">TAKE RESPONSIBILITY</button><button id="completeBtn" class="hidden">COMPLETE CORRECTIVE ACTION</button><div id="completePanel" class="card hidden"><textarea id="completion" placeholder="Work completed"></textarea><select id="equipStatus"><option value="ready_for_verification">Ready for verification / service decision</option><option value="remain_out_of_service">Remain out of service</option></select><input id="evidence" type="file" accept="image/*" capture="environment"><label><input id="second" type="checkbox" style="width:auto"> Request second-manager verification</label><button id="submitComplete">SUBMIT COMPLETION</button></div><p id="mmsg"></p></div></section></main><script src="app-v11.js?v=11.5"></script><script>const q=new URLSearchParams(location.search);if(q.get('pin')){document.getElementById('pin').value=q.get('pin');setTimeout(()=>document.getElementById('loginBtn').click(),50)}</script></body></html>
