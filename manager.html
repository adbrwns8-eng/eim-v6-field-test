<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Management</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:760px;margin:auto;padding:20px}.card,.item{background:white;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none!important}input,textarea,select,button{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:white;font-weight:700}.secondary{background:#475467}.danger{background:#b42318}.redfinding{border:2px solid #b42318;border-left:8px solid #b42318;background:#fff7f6}.redtext{color:#b42318;font-weight:800}.notice{background:#fff7ed;padding:12px;border-radius:10px}.plan{background:#f8fafc}.small{font-size:13px;color:#667085}</style></head><body><main><button onclick="location.href='./'">← EIM HOME</button><h1>Management</h1><section id="login" class="card"><input id="pin" inputmode="numeric" placeholder="PIN"><button id="loginBtn">CONTINUE</button><p id="msg"></p></section><section id="mgr" class="hidden"><div class="card"><h2 id="who"></h2><button id="refresh" class="secondary">REFRESH</button><h3>My Findings</h3><div id="queue"></div><h3>Awaiting My Verification</h3><div id="verifyQueue"></div></div><div id="detail" class="card hidden"><button id="back" class="secondary">← MANAGEMENT QUEUE</button><h2>Finding Detail</h2><div id="detailText"></div><button id="takeRedBtn" class="danger hidden">TAKE RESPONSIBILITY</button><button id="planBtn" class="hidden">CREATE / UPDATE ACTION PLAN</button><div id="planPanel" class="card plan hidden"><h3>RED Corrective Action Plan</h3><label>Immediate controls / restrictions</label><textarea id="controls" rows="3" placeholder="Example: P-13 remains shut down. Do not operate until inspected and released."></textarea><label>Assessment and action plan</label><textarea id="actionPlan" rows="5" placeholder="Describe what will be checked, repaired, replaced, or tested."></textarea><label>Responsible person / crew</label><input id="responsible" placeholder="Maintenance, electrician, vendor, employee name, etc."><label>Planned start</label><input id="planStart" type="datetime-local"><label>Target completion</label><input id="planComplete" type="datetime-local"><label>Work status</label><select id="workStatus"><option>Assessing</option><option>Waiting on Parts/Materials</option><option>Scheduled</option><option>Vendor Required</option><option>Repair in Progress</option></select><label>Materials / additional notes</label><textarea id="materials" rows="3"></textarea><button id="savePlan">SAVE ACTION PLAN</button><p class="small">Saving the plan does not release the RED restriction.</p></div><button id="completeBtn" class="hidden">COMPLETE CORRECTIVE ACTION</button><div id="completePanel" class="card hidden"><textarea id="completion" placeholder="Work completed"></textarea><select id="equipStatus"><option value="ready_for_verification">Ready for verification / service decision</option><option value="remain_out_of_service">Remain out of service</option></select><input id="evidence" type="file" accept="image/*" capture="environment"><label><input id="second" type="checkbox" style="width:auto"> Request second-manager verification</label><button id="submitComplete">SUBMIT COMPLETION</button></div><p id="mmsg"></p></div></section></main><script src="app-v11.js?v=11.6"></script><script>const q=new URLSearchParams(location.search);if(q.get('pin')){document.getElementById('pin').value=q.get('pin');setTimeout(()=>document.getElementById('loginBtn').click(),50)}</script></body></html>
