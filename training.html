<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Training</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.item{border-left:5px solid #b54708}.hidden{display:none}input,button{width:100%;box-sizing:border-box;padding:13px;font-size:16px;margin:7px 0;border-radius:10px;border:1px solid #b8c0cc}button{background:#17202a;color:white;font-weight:700}.small{color:#667085;font-size:13px}</style></head><body><main><button onclick="location.href='./?v=13'">← EIM HOME</button><h1 id="title">My Training</h1><div id="login" class="card"><input id="pin" inputmode="numeric" placeholder="Employee PIN"><button id="go">CONTINUE</button><p id="msg"></p></div><div id="body" class="hidden"><div class="card"><h2 id="hello"></h2><div id="items"></div></div></div></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';const $=x=>document.getElementById(x);async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d?.error||t);return d}async function start(){try{let e=await api('login',{pin:$('pin').value.trim()});e=Array.isArray(e)?e[0]:e;const d=await api('training',{employee_id:e.employee_id||e.id}),mode=new URLSearchParams(location.search).get('mode');$('hello').textContent=e.name;$('items').innerHTML=(d||[]).filter(x=>!mode||mode!=='new_miner'||x.training_type==='new_miner').map(x=>`<div class="card item"><b>${x.title}</b><p>${x.description||''}</p><span class="small">${x.training_type} · ${x.status}${x.due_at?' · Due '+new Date(x.due_at).toLocaleDateString():''}</span></div>`).join('')||'<p>No assigned training in this category.</p>';$('login').classList.add('hidden');$('body').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}$('go').onclick=start;const q=new URLSearchParams(location.search);if(q.get('mode')==='new_miner')$('title').textContent='New Miner / Training';if(q.get('pin')){$('pin').value=q.get('pin');setTimeout(start,50)}</script></body></html>
