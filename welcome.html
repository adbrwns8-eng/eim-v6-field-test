<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to EIM</title><style>body{font-family:Arial;background:#f2f4f7;margin:0;color:#17202a}main{max-width:680px;margin:auto;padding:18px}.card{background:white;border:1px solid #d0d5dd;border-radius:16px;padding:22px;margin:14px 0}button,input,select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:14px;margin:8px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:800}.ack{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.ack input{width:auto;margin-top:3px}.test{color:#9b1c1c;font-size:12px;font-weight:800}</style></head><body><main><h1>Welcome to Energy In Motion</h1><div class="test">EIM FIELD PILOT — FIRST-TIME EMPLOYEE ONBOARDING</div><section class="card"><h2 id="hello">Welcome</h2><p>Before using the field app for the first time, review and acknowledge the expectations below.</p><div class="ack"><input id="a1" type="checkbox"><label for="a1"><b>Role & Responsibility</b><br>I understand I am responsible for completing assigned inspections and reporting unsafe or deficient conditions accurately.</label></div><div class="ack"><input id="a2" type="checkbox"><label for="a2"><b>Safety & Operational Commitment</b><br>I understand that unsafe conditions must be reported and that RED / DO NOT OPERATE instructions must be followed.</label></div><div class="ack"><input id="a3" type="checkbox"><label for="a3"><b>Reporting Expectations</b><br>I understand inspection information, descriptions, photos, and acknowledgments become part of the company record.</label></div><label>Preferred language</label><select id="language"><option value="en">English</option><option value="es">Spanish</option></select><label>Your initials</label><input id="initials" maxlength="6" autocomplete="off" placeholder="Initials"><button id="continue">ACKNOWLEDGE & CONTINUE</button><p id="msg"></p></section></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',q=new URLSearchParams(location.search),pin=q.get('pin')||sessionStorage.getItem('eimPilotPin')||'';let emp;const $=id=>document.getElementById(id);async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.error||t);return d}async function init(){try{let d=await api('login',{pin});emp=Array.isArray(d)?d[0]:d;if(!emp)throw Error('Employee login not found');sessionStorage.setItem('eimPilotPin',pin);$('hello').textContent='Welcome, '+emp.name}catch(e){$('msg').textContent=e.message}}$('continue').onclick=async()=>{const initials=$('initials').value.trim();if(!$('a1').checked||!$('a2').checked||!$('a3').checked)return $('msg').textContent='Please acknowledge all three items.';if(initials.length<2)return $('msg').textContent='Enter your initials.';const b=$('continue');b.disabled=true;b.textContent='SAVING...';try{await api('complete_onboarding',{employee_id:emp.employee_id||emp.id,version:'v1',language:$('language').value,initials});location.href='./?v=13.5&pin='+encodeURIComponent(pin)}catch(e){$('msg').textContent='Could not complete onboarding: '+e.message;b.disabled=false;b.textContent='ACKNOWLEDGE & CONTINUE'}};init()</script></body></html>
