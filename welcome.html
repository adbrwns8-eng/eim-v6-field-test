<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to EIM</title><style>body{font-family:Arial;background:#f2f4f7;margin:0;color:#17202a}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border:1px solid #d0d5dd;border-radius:16px;padding:22px;margin:14px 0}.hero{background:#17202a;color:white}.principle{font-size:19px;line-height:1.5;font-weight:700;border-left:5px solid #667085;padding-left:16px}.mission{font-size:18px;line-height:1.5}button,input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:14px;margin:8px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:800}.ack{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.ack input{width:auto;margin-top:3px}.test{color:#9b1c1c;font-size:12px;font-weight:800}.lang{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lang button{background:#fff;color:#17202a}.lang button.active{background:#17202a;color:#fff}.role{font-weight:800;color:#475467}.small{color:#667085;font-size:14px}</style></head><body><main><h1>Welcome to Energy In Motion</h1><div class="test">EIM FIELD PILOT — COMPANY ONBOARDING</div><section class="card hero"><h2 id="hello">Welcome</h2><div id="role" class="role" style="color:#d0d5dd"></div><p id="intro"></p></section><section class="card"><div class="lang"><button id="en" type="button">ENGLISH</button><button id="es" type="button">ESPAÑOL</button></div><h2 id="missionTitle"></h2><p id="mission" class="mission"></p><h2 id="cultureTitle"></h2><p id="culture" class="principle"></p><h2 id="expectTitle"></h2><div class="ack"><input id="a1" type="checkbox"><label id="l1" for="a1"></label></div><div class="ack"><input id="a2" type="checkbox"><label id="l2" for="a2"></label></div><div class="ack"><input id="a3" type="checkbox"><label id="l3" for="a3"></label></div><label id="initialLabel" for="initials"></label><input id="initials" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="small" id="recordNote"></p><button id="continue"></button><p id="msg"></p></section></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',q=new URLSearchParams(location.search),pin=q.get('pin')||sessionStorage.getItem('eimPilotPin')||'';let emp,language='en';const $=id=>document.getElementById(id);const T={en:{intro:'This onboarding introduces your role in the EIM operating system and the expectations that apply when you use the field app.',missionTitle:'Our Mission',mission:'To operate safely, responsibly, and efficiently while building a culture of accountability, continuous improvement, and operational excellence.',cultureTitle:'Our Commitment',culture:'What we train establishes the expectation. What we reinforce creates the behavior. What leadership repeatedly allows becomes the culture.',expectTitle:'Commitment & Expectations',employee1:'I understand my responsibility is to work safely, follow my training, complete required inspections and report unsafe or deficient conditions accurately.',manager1:'I understand my primary job responsibilities and that, when acting as on-site management, I may be required to make operational and safety decisions within my authority.',owner1:'I understand my leadership responsibility includes maintaining awareness of operations, supporting accountable decisions, and reinforcing EIM expectations and culture.',l2:'I understand that RED / DO NOT OPERATE conditions require immediate attention and that restrictions remain in effect until the condition is legitimately corrected and released through the required process.',l3:'I understand that inspections, training records, descriptions, photos, acknowledgments and other actions recorded in this system become part of the EIM company record.',initial:'Your initials',placeholder:'Initials',go:'ACKNOWLEDGE & CONTINUE',checks:'Please acknowledge all three items.',need:'Enter at least two initials.',record:'Your acknowledgment is tied to your employee profile, PIN and timestamp.'},es:{intro:'Esta orientación presenta su función en el sistema operativo de EIM y las expectativas que se aplican al usar la aplicación de campo.',missionTitle:'Nuestra Misión',mission:'Operar de manera segura, responsable y eficiente mientras construimos una cultura de responsabilidad, mejora continua y excelencia operacional.',cultureTitle:'Nuestro Compromiso',culture:'Lo que capacitamos establece la expectativa. Lo que reforzamos crea el comportamiento. Lo que el liderazgo permite repetidamente se convierte en la cultura.',expectTitle:'Compromiso y Expectativas',employee1:'Entiendo que mi responsabilidad es trabajar de manera segura, seguir mi capacitación, completar las inspecciones requeridas y reportar con precisión condiciones inseguras o deficientes.',manager1:'Entiendo mis responsabilidades principales y que, cuando actúe como gerencia en el sitio, puede ser necesario tomar decisiones operacionales y de seguridad dentro de mi autoridad.',owner1:'Entiendo que mi responsabilidad de liderazgo incluye mantener conocimiento de las operaciones, apoyar decisiones responsables y reforzar las expectativas y la cultura de EIM.',l2:'Entiendo que las condiciones ROJO / NO OPERAR requieren atención inmediata y que las restricciones permanecen vigentes hasta que la condición sea corregida y liberada mediante el proceso requerido.',l3:'Entiendo que las inspecciones, registros de capacitación, descripciones, fotos, reconocimientos y otras acciones registradas en este sistema forman parte del registro de EIM.',initial:'Sus iniciales',placeholder:'Iniciales',go:'RECONOCER Y CONTINUAR',checks:'Reconozca los tres puntos.',need:'Ingrese al menos dos iniciales.',record:'Su reconocimiento queda vinculado a su perfil de empleado, PIN y fecha/hora.'}};async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.error||'Unable to save onboarding.');return d}function roleKind(){const r=String(emp?.role||emp?.access_level||'').toLowerCase();if(r.includes('owner'))return'owner';if(r.includes('manager')||r.includes('supervisor')||r.includes('safety')||r.includes('hr'))return'manager';return'employee'}function render(){const t=T[language],k=roleKind();$('intro').textContent=t.intro;$('missionTitle').textContent=t.missionTitle;$('mission').textContent=t.mission;$('cultureTitle').textContent=t.cultureTitle;$('culture').textContent=t.culture;$('expectTitle').textContent=t.expectTitle;$('l1').textContent=t[k+'1'];$('l2').textContent=t.l2;$('l3').textContent=t.l3;$('initialLabel').textContent=t.initial;$('initials').placeholder=t.placeholder;$('recordNote').textContent=t.record;$('continue').textContent=t.go;$('en').classList.toggle('active',language==='en');$('es').classList.toggle('active',language==='es');if(emp){$('hello').textContent=(language==='es'?'Bienvenido, ':'Welcome, ')+emp.name;$('role').textContent=emp.role||emp.access_level||''}}function norm(){const v=$('initials').value.replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,6);$('initials').value=v;return v}$('initials').addEventListener('input',norm);$('initials').addEventListener('blur',norm);$('en').onclick=()=>{language='en';render()};$('es').onclick=()=>{language='es';render()};async function init(){render();try{let d=await api('login',{pin});emp=Array.isArray(d)?d[0]:d;if(!emp)throw Error('Employee profile not found. Contact a manager before onboarding.');sessionStorage.setItem('eimPilotPin',pin);render()}catch(e){$('msg').textContent=e.message;$('continue').disabled=true}}$('continue').onclick=async()=>{const initials=norm(),t=T[language];if(!$('a1').checked||!$('a2').checked||!$('a3').checked)return $('msg').textContent=t.checks;if(initials.length<2)return $('msg').textContent=t.need;if(!emp)return $('msg').textContent='Employee profile not found. Contact a manager before onboarding.';const b=$('continue');b.disabled=true;b.textContent=language==='es'?'GUARDANDO...':'SAVING...';try{await api('complete_onboarding',{employee_id:emp.employee_id||emp.id,version:'v2',language,initials});location.href='./?v=15&pin='+encodeURIComponent(pin)}catch(e){$('msg').textContent=language==='es'?'No se pudo completar el registro. Comuníquese con un supervisor.':'Could not complete onboarding. Contact a supervisor.';b.disabled=false;b.textContent=t.go}};init()</script></body></html>
