<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to EIM</title><style>body{font-family:Arial;background:#f2f4f7;margin:0;color:#17202a}main{max-width:680px;margin:auto;padding:18px}.card{background:white;border:1px solid #d0d5dd;border-radius:16px;padding:22px;margin:14px 0}button,input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:14px;margin:8px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:800}.ack{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.ack input{width:auto;margin-top:3px}.test{color:#9b1c1c;font-size:12px;font-weight:800}.lang{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lang button{background:#fff;color:#17202a}.lang button.active{background:#17202a;color:#fff}</style></head><body><main><h1>Welcome to Energy In Motion</h1><div class="test">EIM FIELD PILOT — FIRST-TIME EMPLOYEE ONBOARDING</div><section class="card"><h2 id="hello">Welcome</h2><p id="intro"></p><div class="lang"><button id="en" type="button">ENGLISH</button><button id="es" type="button">ESPAÑOL</button></div><div class="ack"><input id="a1" type="checkbox"><label id="l1" for="a1"></label></div><div class="ack"><input id="a2" type="checkbox"><label id="l2" for="a2"></label></div><div class="ack"><input id="a3" type="checkbox"><label id="l3" for="a3"></label></div><label id="initialLabel" for="initials"></label><input id="initials" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="continue"></button><p id="msg"></p></section></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',q=new URLSearchParams(location.search),pin=q.get('pin')||sessionStorage.getItem('eimPilotPin')||'';let emp,language='en';const $=id=>document.getElementById(id),T={en:{intro:'Before using the field app for the first time, review and acknowledge the expectations below.',l1:'<b>Role & Responsibility</b><br>I understand I am responsible for completing assigned inspections and reporting unsafe or deficient conditions accurately.',l2:'<b>Safety & Operational Commitment</b><br>I understand that unsafe conditions must be reported and RED / DO NOT OPERATE instructions must be followed.',l3:'<b>Reporting Expectations</b><br>I understand inspection information, descriptions, photos, and acknowledgments become part of the company record.',initial:'Your initials',placeholder:'Initials',go:'ACKNOWLEDGE & CONTINUE',checks:'Please acknowledge all three items.',need:'Enter at least two initials.'},es:{intro:'Antes de usar la aplicación de campo por primera vez, revise y reconozca las expectativas a continuación.',l1:'<b>Función y responsabilidad</b><br>Entiendo que soy responsable de completar las inspecciones asignadas y reportar con precisión las condiciones inseguras o deficientes.',l2:'<b>Compromiso con la seguridad y las operaciones</b><br>Entiendo que las condiciones inseguras deben reportarse y que se deben seguir las instrucciones ROJO / NO OPERAR.',l3:'<b>Expectativas de reportes</b><br>Entiendo que la información de inspección, descripciones, fotos y reconocimientos forman parte del registro de la empresa.',initial:'Sus iniciales',placeholder:'Iniciales',go:'RECONOCER Y CONTINUAR',checks:'Reconozca los tres puntos.',need:'Ingrese al menos dos iniciales.'}};async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.error||'Unable to save onboarding.');return d}function render(){const t=T[language];$('intro').textContent=t.intro;$('l1').innerHTML=t.l1;$('l2').innerHTML=t.l2;$('l3').innerHTML=t.l3;$('initialLabel').textContent=t.initial;$('initials').placeholder=t.placeholder;$('continue').textContent=t.go;$('en').classList.toggle('active',language==='en');$('es').classList.toggle('active',language==='es')}function norm(){const v=$('initials').value.replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,6);$('initials').value=v;return v}$('initials').addEventListener('input',norm);$('initials').addEventListener('blur',norm);$('en').onclick=()=>{language='en';render()};$('es').onclick=()=>{language='es';render()};async function init(){render();try{let d=await api('login',{pin});emp=Array.isArray(d)?d[0]:d;if(!emp)throw Error('Employee profile not found. Contact a manager before onboarding.');sessionStorage.setItem('eimPilotPin',pin);$('hello').textContent=(language==='es'?'Bienvenido, ':'Welcome, ')+emp.name}catch(e){$('msg').textContent=e.message;$('continue').disabled=true}}$('continue').onclick=async()=>{const initials=norm(),t=T[language];if(!$('a1').checked||!$('a2').checked||!$('a3').checked)return $('msg').textContent=t.checks;if(initials.length<2)return $('msg').textContent=t.need;if(!emp)return $('msg').textContent='Employee profile not found. Contact a manager before onboarding.';const b=$('continue');b.disabled=true;b.textContent=language==='es'?'GUARDANDO...':'SAVING...';try{await api('complete_onboarding',{employee_id:emp.employee_id||emp.id,version:'v1',language,initials});location.href='./?v=14&pin='+encodeURIComponent(pin)}catch(e){$('msg').textContent=language==='es'?'No se pudo completar el registro. Comuníquese con un supervisor.':'Could not complete onboarding. Contact a supervisor.';b.disabled=false;b.textContent=t.go}};init()</script></body></html>
