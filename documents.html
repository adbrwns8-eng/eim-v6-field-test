<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Documents</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:650px;margin:auto;padding:18px}.card{background:white;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}input,button{width:100%;box-sizing:border-box;padding:13px;font-size:16px;margin:7px 0;border-radius:10px;border:1px solid #b8c0cc}button{background:#17202a;color:white;font-weight:700}.small{font-size:13px;color:#667085}</style></head><body><main><button onclick="location.href='./?v=13'">← EIM HOME</button><h1>SOPs / Documents</h1><div id="login" class="card"><input id="pin" inputmode="numeric" placeholder="Employee PIN"><button id="go">CONTINUE</button><p id="msg"></p></div><div id="items" class="hidden"></div></main><script>const A='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api',$=x=>document.getElementById(x);async function api(a,b){const r=await fetch(A+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d?.error||t);return d}async function start(){try{let e=await api('login',{pin:$('pin').value.trim()});e=Array.isArray(e)?e[0]:e;const d=await api('documents',{employee_id:e.employee_id||e.id});$('items').innerHTML=(d||[]).map(x=>`<div class="card"><b>${x.title}</b><p>${x.description||''}</p><span class="small">${x.document_type}${x.version?' · Version '+x.version:''}</span>${x.url?`<button onclick="location.href='${x.url}'">OPEN DOCUMENT</button>`:''}</div>`).join('')||'<div class="card">No active documents assigned to your role yet.</div>';$('login').classList.add('hidden');$('items').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}$('go').onclick=start;const q=new URLSearchParams(location.search);if(q.get('pin')){$('pin').value=q.get('pin');setTimeout(start,50)}</script></body></html>
