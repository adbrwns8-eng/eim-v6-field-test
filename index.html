padding:14px;margin:12px 0}.langbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.langbar button{width:auto;margin:0;min-height:38px;padding:8px 14px;background:#fff;color:#17202a}.langbar button.active{background:#17202a;color:#fff}@media(max-width:640px){.row,.tiles{display:block}}

const API_BASE='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';let employee=null,findingId=null,manager=null,currentFinding=null,inspectionType=null;let lang=localStorage.getItem('eimLang')||'en';
const T={en:{test:'EIM FIELD TEST — v6<br>TEST ENVIRONMENT — NOT PRODUCTION',access:'Access',continue:'CONTINUE',pins:'Employee test PIN: 1111 · Manager test PIN: 2222',checking:'Checking PIN...',badpin:'PIN not recognized.',connection:'Connection error: ',welcome:'Welcome, ',mission:'<p><b>Our Mission</b><br>To operate safely, responsibly, and efficiently while building a culture of accountability, continuous improvement, and operational excellence.</p><p><b>Our Commitment</b></p><p class="commit">“What we train establishes the expectation. What we reinforce creates the behavior. What leadership repeatedly allows becomes the culture.”</p>',helpReminder:'When you are unsure, stop and ask. The Help button is available throughout the app.',understand:'I UNDERSTAND — CONTINUE',homeQuestion:'What do you need to do?',vehicle:'VEHICLE / MOBILE EQUIPMENT INSPECTION',plant:'PLANT INSPECTION',work:'WORK AREA INSPECTION',incident:'REPORT AN INCIDENT',homeNote:'Inspection categories will be connected to the appropriate equipment and area lists as the pilot expands.',home:'HOME',inspection:'Inspection',equipment:'Equipment',desc:'Test deficiency description',defaultDesc:'During the inspection I noticed the access step handrail is loose and moves when pressure is applied. The mounting point appears worn. I am concerned someone could lose their balance while climbing onto the equipment.',photo:'Test photo',photoNote:'For this pilot, any harmless test photo is acceptable.',submit:'SUBMIT TEST DEFICIENCY',needPhoto:'Select a harmless test photo.',ack:'I UNDERSTAND',doneTitle:'✓ Test Report Submitted',doneText:'Your instruction acknowledgement has been recorded.',queue:'Management Queue',refresh:'REFRESH FINDINGS',loading:'Loading...',newAssignment:'NEW ASSIGNMENT',newAssignments:'NEW ASSIGNMENTS',attention:'Requires your attention. Open the finding below to review the handoff and respond.',noFindings:'No open findings or assignments.',openFinding:'OPEN FINDING',handoff:'Handoff',from:'from',detail:'Finding Detail',finding:'Finding',severity:'Severity',status:'Status',ackFinding:'ACKNOWLEDGE FINDING',response:'Choose Response',take:'TAKE OWNERSHIP',assign:'ASSIGN / TRANSFER',escalate:'ESCALATE',takeTitle:'Take Ownership',actionPlan:'Action plan',start:'Planned start',complete:'Planned completion',confirmTake:'CONFIRM OWNERSHIP',assignTitle:'Assign / Transfer',assignTo:'Assign to',handoffNote:'Handoff note',confirmAssign:'CONFIRM ASSIGNMENT',escalateTitle:'Escalate',reason:'Reason',confirmEscalate:'CONFIRM ESCALATION',opened:'Finding opened and timestamped.',acknowledged:'Acknowledged. Choose ownership, transfer, or escalation.',required:'Action plan, start, and completion are required.',owned:'Ownership accepted and corrective action plan recorded.',transferred:'Finding assigned/transferred and recorded.',reasonRequired:'Escalation reason is required.',escalated:'Management escalation recorded.',help:'? HELP',helpTitle:'Help',helpBody:'<p><b>Not sure what to do?</b> Stop and ask your supervisor or manager. Do not guess about equipment condition or operating authorization.</p><p><b>Reporting:</b> Describe what you actually observe. Use clear facts and a useful photo when required.</p><p><b>Emergency:</b> Follow EIM\'s current emergency-response procedure. The site-specific emergency protocol will be added to this pilot after management provides the approved call order and contacts.</p>',closeHelp:'CLOSE HELP',incidentMsg:'Incident reporting is queued for the next pilot module. Continue using the current EIM incident/emergency process until that module is approved and tested.',vehicleTitle:'Vehicle / Mobile Equipment Inspection',plantTitle:'Plant Inspection',workTitle:'Work Area Inspection'},es:{test:'PRUEBA DE CAMPO EIM — v6<br>ENTORNO DE PRUEBA — NO ES PRODUCCIÓN',access:'Acceso',continue:'CONTINUAR',pins:'PIN de empleado de prueba: 1111 · PIN de gerente de prueba: 2222',checking:'Verificando PIN...',badpin:'PIN no reconocido.',connection:'Error de conexión: ',welcome:'Bienvenido, ',mission:'<p><b>Nuestra Misión</b><br>Operar de manera segura, responsable y eficiente mientras construimos una cultura de responsabilidad, mejora continua y excelencia operacional.</p><p><b>Nuestro Compromiso</b></p><p class="commit">“Lo que capacitamos establece la expectativa. Lo que reforzamos crea el comportamiento. Lo que el liderazgo permite repetidamente se convierte en la cultura.”</p>',helpReminder:'Cuando no esté seguro, deténgase y pregunte. El botón de Ayuda está disponible en toda la aplicación.',understand:'ENTIENDO — CONTINUAR',homeQuestion:'¿Qué necesita hacer?',vehicle:'INSPECCIÓN DE VEHÍCULO / EQUIPO MÓVIL',plant:'INSPECCIÓN DE PLANTA',work:'INSPECCIÓN DEL ÁREA DE TRABAJO',incident:'REPORTAR UN INCIDENTE',homeNote:'Las categorías de inspección se conectarán con las listas correspondientes de equipos y áreas a medida que se amplíe la prueba piloto.',home:'INICIO',inspection:'Inspección',equipment:'Equipo',desc:'Descripción de la deficiencia de prueba',defaultDesc:'Durante la inspección noté que el pasamanos del escalón de acceso está flojo y se mueve cuando se aplica presión. El punto de montaje parece desgastado. Me preocupa que alguien pueda perder el equilibrio al subir al equipo.',photo:'Foto de prueba',photoNote:'Para esta prueba piloto, cualquier foto de prueba que no presente riesgo es aceptable.',submit:'ENVIAR DEFICIENCIA DE PRUEBA',needPhoto:'Seleccione una foto de prueba que no presente riesgo.',ack:'ENTIENDO',doneTitle:'✓ Reporte de Prueba Enviado',doneText:'Se registró su confirmación de las instrucciones.',queue:'Cola de Administración',refresh:'ACTUALIZAR HALLAZGOS',loading:'Cargando...',newAssignment:'NUEVA ASIGNACIÓN',newAssignments:'NUEVAS ASIGNACIONES',attention:'Requiere su atención. Abra el hallazgo de abajo para revisar la transferencia y responder.',noFindings:'No hay hallazgos ni asignaciones abiertas.',openFinding:'ABRIR HALLAZGO',handoff:'Transferencia',from:'de',detail:'Detalle del Hallazgo',finding:'Hallazgo',severity:'Severidad',status:'Estado',ackFinding:'CONFIRMAR HALLAZGO',response:'Seleccione una Respuesta',take:'ASUMIR RESPONSABILIDAD',assign:'ASIGNAR / TRANSFERIR',escalate:'ESCALAR',takeTitle:'Asumir Responsabilidad',actionPlan:'Plan de acción',start:'Inicio planeado',complete:'Finalización planeada',confirmTake:'CONFIRMAR RESPONSABILIDAD',assignTitle:'Asignar / Transferir',assignTo:'Asignar a',handoffNote:'Nota de transferencia',confirmAssign:'CONFIRMAR ASIGNACIÓN',escalateTitle:'Escalar',reason:'Motivo',confirmEscalate:'CONFIRMAR ESCALAMIENTO',opened:'Hallazgo abierto y hora registrada.',acknowledged:'Confirmado. Seleccione responsabilidad, transferencia o escalamiento.',required:'Se requieren el plan de acción, inicio y finalización.',owned:'Responsabilidad aceptada y plan de acción correctiva registrado.',transferred:'Hallazgo asignado/transferido y registrado.',reasonRequired:'Se requiere el motivo del escalamiento.',escalated:'Escalamiento de administración registrado.',help:'? AYUDA',helpTitle:'Ayuda',helpBody:'<p><b>¿No está seguro de qué hacer?</b> Deténgase y pregunte a su supervisor o gerente. No adivine sobre la condición del equipo ni sobre su autorización para operarlo.</p><p><b>Reporte:</b> Describa claramente lo que observa. Use hechos precisos y una foto útil cuando sea necesario.</p><p><b>Emergencia:</b> Siga el procedimiento actual de respuesta a emergencias de EIM. El protocolo específico del sitio se agregará a esta prueba piloto después de que la administración proporcione el orden de llamadas y los contactos aprobados.</p>',closeHelp:'CERRAR AYUDA',incidentMsg:'El reporte de incidentes está previsto para el próximo módulo piloto. Continúe usando el proceso actual de incidentes/emergencias de EIM hasta que ese módulo sea aprobado y probado.',vehicleTitle:'Inspección de Vehículo / Equipo Móvil',plantTitle:'Inspección de Planta',workTitle:'Inspección del Área de Trabajo'}};
function tr(){return T[lang]}
function roleCopy(d){if(isOwner(d)){return lang==='es'?'<div class="owner-box"><p><b>Rol: Propietario — Energy In Motion</b></p><p>Como propietario, su responsabilidad es establecer y apoyar los estándares bajo los cuales opera Energy In Motion. La propiedad establece prioridades, asegura los recursos necesarios y responsabiliza a la administración de llevar esos estándares al campo.</p><p>Este sistema le da visibilidad para confirmar si las expectativas se están reforzando mediante capacitación, inspecciones, acciones correctivas, reportes de incidentes, cumplimiento y desempeño operacional.</p><p><b>Sus responsabilidades en este sistema:</b> establecer la expectativa; proporcionar recursos adecuados; revisar el desempeño y las tendencias; reforzar la responsabilidad a través de la administración; e intervenir cuando la organización se aleje del estándar.</p></div>':'<div class="owner-box"><p><b>Role: Owner — Energy In Motion</b></p><p>As an owner, your responsibility is to establish and support the standards under which Energy In Motion operates. Ownership sets priorities, ensures the organization has the resources needed to meet those standards, and holds management accountable for carrying them into the field.</p><p>This system gives you visibility into whether expectations are being reinforced through training, inspections, corrective actions, incident reporting, compliance, and operational performance.</p><p><b>Your responsibilities in this system:</b> establish the expectation; provide appropriate resources; review performance and trends; reinforce accountability through management; and intervene when the organization is drifting from the standard.</p></div>'}const role=(d.role||'employee');return lang==='es'?'<p><b>Rol: '+role+'</b></p><p>Su responsabilidad es realizar el trabajo para el cual está capacitado y autorizado, completar las inspecciones requeridas, reportar deficiencias e incidentes con precisión, seguir las restricciones operacionales y contactar a supervisión cuando las condiciones no estén claras.</p>':'<p><b>Role: '+role+'</b></p><p>Your responsibility is to perform the work you are trained and authorized to do, complete required inspections, report deficiencies and incidents accurately, follow operating restrictions, and contact supervision whenever conditions are unclear.</p>'}
function isManagement(d){return d.access_level==='manager'||d.access_level==='admin'||d.access_level==='lead_supervisor'}function isOwner(d){return String(d.role||'').toLowerCase()==='owner'}
function applyLanguage(){const t=tr();document.documentElement.lang=lang;langEn.classList.toggle('active',lang==='en');langEs.classList.toggle('active',lang==='es');testBanner.innerHTML=t.test;accessTitle.textContent=t.access;loginBtn.textContent=t.continue;testPins.textContent=t.pins;missionBlock.innerHTML=t.mission;helpReminder.textContent=t.helpReminder;welcomeContinue.textContent=t.understand;homeQuestion.textContent=t.homeQuestion;vehicleBtn.textContent=t.vehicle;plantBtn.textContent=t.plant;workBtn.textContent=t.work;incidentBtn.textContent=t.incident;homeNote.textContent=t.homeNote;inspectionHomeBtn.textContent='← '+t.home;equipmentLabel.textContent=t.equipment;descLabel.textContent=t.desc;photoLabel.textContent=t.photo;photoNote.textContent=t.photoNote;submitBtn.textContent=t.submit;ackBtn.textContent=t.ack;doneTitle.textContent=t.doneTitle;doneText.textContent=t.doneText;doneHomeBtn.textContent=t.home;refreshQueue.textContent=t.refresh;managerHomeBtn.textContent='← '+t.home;detailTitle.textContent=t.detail;mgrAckBtn.textContent=t.ackFinding;responseTitle.textContent=t.response;takeBtn.textContent=t.take;assignBtn.textContent=t.assign;escalateBtn.textContent=t.escalate;takeTitle.textContent=t.takeTitle;actionPlanLabel.textContent=t.actionPlan;startLabel.textContent=t.start;completeLabel.textContent=t.complete;confirmTake.textContent=t.confirmTake;assignTitle.textContent=t.assignTitle;assignToLabel.textContent=t.assignTo;handoffLabel.textContent=t.handoffNote;confirmAssign.textContent=t.confirmAssign;escalateTitle.textContent=t.escalateTitle;reasonLabel.textContent=t.reason;confirmEscalate.textContent=t.confirmEscalate;helpBtn.textContent=t.help;helpTitle.textContent=t.helpTitle;helpBody.innerHTML=t.helpBody;closeHelpBtn.textContent=t.closeHelp;if(!employee){description.value=t.defaultDesc}else{welcomeName.textContent=t.welcome+employee.name;roleMessage.innerHTML=roleCopy(employee);systemPurpose.innerHTML=isOwner(employee)?(lang==='es'?'<b>Cómo esta aplicación apoya su función</b><br>El propósito no es generar actividad por sí sola. Crea un registro factual de lo que se capacita, observa, reporta, corrige, verifica y refuerza para que la propiedad pueda ver si la misión y el compromiso de la compañía se llevan a las operaciones diarias.':'<b>How this app supports your role</b><br>The purpose is not to generate activity for its own sake. It creates a factual record of what is trained, observed, reported, corrected, verified, and reinforced so ownership can see whether the company’s mission and commitment are being carried into daily operations.'):(lang==='es'?'<b>Su parte en este sistema</b><br>Reporte lo que realmente observa. Sea preciso y honesto. No exagere una condición para provocar una respuesta y no minimice un problema. Este sistema es una herramienta de aprendizaje y responsabilidad para usted y para Energy In Motion.':'<b>Your part in this system</b><br>Report what you actually see. Be accurate and honest. Do not exaggerate a condition to trigger a response, and do not minimize a problem. This system is a learning and accountability tool for you and for Energy In Motion.');if(isManagement(employee))managerHello.textContent=t.welcome+employee.name+' — '+t.queue;else employeeHomeName.textContent=t.welcome+employee.name;if(inspectionType)inspectionTitle.textContent=inspectionType==='vehicle'?t.vehicleTitle:inspectionType==='plant'?t.plantTitle:t.workTitle}}
function setLanguage(v){lang=v;localStorage.setItem('eimLang',v);applyLanguage();if(manager&&!managerCard.classList.contains('hidden'))loadQueue()}
async function api(action,body){const r=await fetch(API_BASE+'?a='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}async function getList(action){const r=await fetch(API_BASE+'?a='+encodeURIComponent(action));const tx=await r.text();let d=[];try{d=tx?JSON.parse(tx):[]}catch{}if(!r.ok)throw new Error((d&&d.error)||'Load failed');return d}async function loadEquipment(){const data=await getList('equipment');equipment.innerHTML=data.map(x=>'<option value="'+x.id+'">'+x.equipment_id+' — '+x.description+'</option>').join('')}async function loadAssignees(){const data=await getList('assignees');assignee.innerHTML=data.map(x=>'<option value="'+x.id+'">'+x.name+' — '+x.role+'</option>').join('')}
loginBtn.onclick=async()=>{loginBtn.disabled=true;loginMsg.textContent=tr().checking;try{const d=await api('login',{pin:pin.value.trim()});if(!d.ok){loginMsg.textContent=tr().badpin;return}employee=d;if(isManagement(d))manager=d;loginCard.classList.add('hidden');helpBtn.classList.remove('hidden');applyLanguage();welcomeCard.classList.remove('hidden')}catch(e){loginMsg.textContent=tr().connection+e.message}finally{loginBtn.disabled=false}}
welcomeContinue.onclick=async()=>{welcomeCard.classList.add('hidden');if(isManagement(employee)){managerCard.classList.remove('hidden');managerHello.textContent=tr().welcome+employee.name+' — '+tr().queue;await loadAssignees();await loadQueue()}else{employeeHome.classList.remove('hidden');employeeHomeName.textContent=tr().welcome+employee.name}};helpBtn.onclick=()=>helpModal.classList.remove('hidden');
async function chooseInspection(type){inspectionType=type;employeeHome.classList.add('hidden');employeeCard.classList.remove('hidden');inspectionTitle.textContent=type==='vehicle'?tr().vehicleTitle:type==='plant'?tr().plantTitle:tr().workTitle;hello.textContent=employee.name;description.value=tr().defaultDesc;await loadEquipment()}function backHome(){employeeCard.classList.add('hidden');employeeHome.classList.remove('hidden')}function incidentPlaceholder(){alert(tr().incidentMsg)}function goHome(){resultCard.classList.add('hidden');doneCard.classList.add('hidden');employeeCard.classList.add('hidden');employeeHome.classList.remove('hidden')}function managerHome(){managerDetail.classList.add('hidden');postAck.classList.add('hidden');takePanel.classList.add('hidden');assignPanel.classList.add('hidden');escalatePanel.classList.add('hidden');loadQueue()}
async function loadQueue(){const t=tr();queue.innerHTML=t.loading;managerAlert.classList.add('hidden');const data=await api('manager_queue',{manager_id:manager.employee_id});window._queue=data;const assigned=data.filter(x=>x.assigned_to===manager.employee_id&&x.finding_status==='assigned');if(assigned.length){managerAlert.innerHTML='<strong>'+assigned.length+' '+(assigned.length===1?t.newAssignment:t.newAssignments)+'</strong>'+t.attention;managerAlert.classList.remove('hidden')}queue.innerHTML=data.length?data.map(x=>{const mine=x.assigned_to===manager.employee_id&&x.finding_status==='assigned';return '<div class="queue-item'+(mine?' assigned':'')+'">'+(mine?'<div class="new-badge">'+t.newAssignment+'</div>':'')+'<div><span class="badge">'+String(x.current_severity).toUpperCase()+'</span> '+(x.equipment_code||'')+' — '+(x.equipment_description||'')+'</div><p>'+x.description+'</p>'+(x.handoff_note?'<p><b>'+t.handoff+':</b> '+x.handoff_note+(x.assigned_by_name?' — '+t.from+' '+x.assigned_by_name:'')+'</p>':'')+'<button onclick="openFinding(\''+x.finding_id+'\')">'+t.openFinding+'</button></div>'}).join(''):'<p>'+t.noFindings+'</p>'}
async function openFinding(id){const t=tr();currentFinding=(window._queue||[]).find(x=>x.finding_id===id);if(!currentFinding)return;await api('manager_open',{manager_id:manager.employee_id,finding_id:id});managerDetail.classList.remove('hidden');postAck.classList.add('hidden');mgrAckBtn.classList.remove('hidden');detailText.innerHTML='<p><b>'+t.finding+' #'+currentFinding.finding_no+'</b></p><p><b>'+t.equipment+':</b> '+currentFinding.equipment_code+' — '+currentFinding.equipment_description+'</p><p><b>'+t.severity+':</b> '+String(currentFinding.current_severity).toUpperCase()+'</p><p><b>'+t.status+':</b> '+String(currentFinding.finding_status||'').toUpperCase()+'</p>'+(currentFinding.handoff_note?'<p><b>'+t.handoffNote+':</b> '+currentFinding.handoff_note+(currentFinding.assigned_by_name?' <span class="small">— '+t.from+' '+currentFinding.assigned_by_name+'</span>':'')+'</p>':'')+'<p>'+currentFinding.description+'</p>';managerMsg.textContent=t.opened}
submitBtn.onclick=async()=>{if(!photo.files.length){submitMsg.textContent=tr().needPhoto;return}submitBtn.disabled=true;try{const d=await api('submit',{employee_id:employee.employee_id,equipment_id:equipment.value,description:description.value,photo_note:photo.files[0].name});findingId=d.finding_id;employeeCard.classList.add('hidden');resultCard.classList.remove('hidden');resultCard.classList.add(d.instruction_level);status.textContent=d.instruction_level.toUpperCase()+' — '+d.severity.toUpperCase();instruction.textContent=d.instruction;finding.textContent=tr().finding+' ID: '+d.finding_id}catch(e){submitMsg.textContent=e.message}finally{submitBtn.disabled=false}};ackBtn.onclick=async()=>{await api('ack',{finding_id:findingId});resultCard.classList.add('hidden');doneCard.classList.remove('hidden')};refreshQueue.onclick=loadQueue;mgrAckBtn.onclick=async()=>{await api('manager_ack',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id});mgrAckBtn.classList.add('hidden');postAck.classList.remove('hidden');managerMsg.textContent=tr().acknowledged};takeBtn.onclick=()=>{takePanel.classList.toggle('hidden');assignPanel.classList.add('hidden');escalatePanel.classList.add('hidden')};assignBtn.onclick=()=>{assignPanel.classList.toggle('hidden');takePanel.classList.add('hidden');escalatePanel.classList.add('hidden')};escalateBtn.onclick=()=>{escalatePanel.classList.toggle('hidden');takePanel.classList.add('hidden');assignPanel.classList.add('hidden')};confirmTake.onclick=async()=>{if(!actionPlan.value||!plannedStart.value||!plannedComplete.value){managerMsg.textContent=tr().required;return}await api('take_ownership',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,action_plan:actionPlan.value,planned_start_at:new Date(plannedStart.value).toISOString(),planned_complete_at:new Date(plannedComplete.value).toISOString()});managerMsg.textContent=tr().owned;await loadQueue()};confirmAssign.onclick=async()=>{await api('assign_transfer',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,assignee_id:assignee.value,note:handoffNote.value||'Pilot transfer'});managerMsg.textContent=tr().transferred;await loadQueue()};confirmEscalate.onclick=async()=>{if(!escalateReason.value){managerMsg.textContent=tr().reasonRequired;return}await api('escalate',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,reason:escalateReason.value});managerMsg.textContent=tr().escalated;await loadQueue()};applyLanguage();
</script></body></html>
