<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EIM v6 Field Test</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f8;color:#17202a}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:24px;margin:0 0 6px}.test{font-weight:700;color:#9b1c1c;margin-bottom:14px}.hidden{display:none!important}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:700;min-height:46px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#475467}.danger{background:#b42318}.green{background:#e7f7eb}.yellow{background:#fff4cc}.red{background:#ffe0e0}.small{font-size:13px;color:#5d6673}.status{font-weight:800;font-size:22px}.queue-item{border:1px solid #d0d5dd;border-radius:10px;padding:14px;margin:10px 0;background:#fff}.queue-item.new-assignment{border:2px solid #b54708;background:#fff7ed}.queue-item.owned{border:2px solid #1a7f37;background:#eefaf1}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px;background:#eef2f6}.new-badge,.owned-badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:800;font-size:12px;color:#fff;margin-bottom:8px}.new-badge{background:#b54708}.owned-badge{background:#1a7f37}.alert-banner{border:2px solid #b54708;background:#fff7ed;border-radius:12px;padding:16px;margin:0 0 14px;font-weight:700}.alert-banner strong{display:block;font-size:20px;margin-bottom:4px}.row{display:flex;gap:10px}.row>*{flex:1}.mission{border-left:4px solid #17202a;padding-left:14px}.commit{font-weight:700}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.help{position:fixed;right:18px;bottom:18px;width:auto;padding:12px 18px;border-radius:999px;box-shadow:0 3px 12px #0003;z-index:4}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal .card{max-width:520px;width:100%;max-height:80vh;overflow:auto}.langbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.langbar button{width:auto;margin:0;min-height:38px;padding:8px 14px;background:#fff;color:#17202a}.langbar button.active{background:#17202a;color:#fff}.ack-section{border:1px solid #d0d5dd;border-radius:12px;padding:16px;margin:14px 0;background:#fafafa}.ack-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:700}.ack-row input{width:22px;height:22px;margin:0;accent-color:#1a7f37;flex:0 0 auto}.ack-complete{border-color:#1a7f37;background:#eefaf1}.initials-wrap{margin-top:16px}.initials-wrap input{text-transform:uppercase;max-width:180px}.first-login-note{background:#eef2f6;border-radius:10px;padding:12px;font-size:14px}.manager-error{color:#b42318;font-weight:700}.manager-ok{color:#1a7f37;font-weight:700}.plan-summary{background:#f7f8fa;border:1px solid #d0d5dd;border-radius:10px;padding:12px;margin-top:12px}@media(max-width:640px){.row,.tiles{display:block}}
</style>
</head>
<body><main>
<div class="langbar"><button id="langEn">English</button><button id="langEs">Español</button></div>
<h1>ENERGY IN MOTION</h1><div id="testBanner" class="test"></div>
<section id="loginCard" class="card"><h2 id="accessTitle"></h2><input id="pin" inputmode="numeric" pattern="[0-9]*" placeholder="PIN"><button id="loginBtn"></button><p id="loginMsg" class="small"></p><p id="testPins" class="small"></p></section>
<section id="welcomeCard" class="card hidden"><h2 id="welcomeName"></h2><p id="firstLoginNote" class="first-login-note"></p><div id="ack1" class="ack-section"><h3 id="ack1Title"></h3><div id="roleMessage"></div><label class="ack-row"><input id="ackRole" type="checkbox"><span id="ack1CheckText"></span></label></div><div id="ack2" class="ack-section"><h3 id="ack2Title"></h3><div id="missionBlock" class="mission"></div><label class="ack-row"><input id="ackMission" type="checkbox"><span id="ack2CheckText"></span></label></div><div id="ack3" class="ack-section"><h3 id="ack3Title"></h3><p id="systemPurpose"></p><p id="helpReminder"></p><label class="ack-row"><input id="ackReporting" type="checkbox"><span id="ack3CheckText"></span></label></div><div class="initials-wrap"><label id="initialsLabel" for="initials"></label><input id="initials" maxlength="10" autocomplete="off"><p id="ackMsg" class="small"></p></div><button id="welcomeContinue" disabled></button></section>
<section id="employeeHome" class="card hidden"><h2 id="employeeHomeName"></h2><p id="homeQuestion"></p><div class="tiles"><button id="vehicleBtn"></button><button id="plantBtn"></button><button id="workBtn"></button><button id="incidentBtn" class="danger"></button></div><p id="homeNote" class="small"></p></section>
<section id="employeeCard" class="card hidden"><button id="inspectionHomeBtn" class="secondary"></button><h2 id="inspectionTitle"></h2><h3 id="hello"></h3><label id="equipmentLabel"></label><select id="equipment"></select><label id="descLabel"></label><textarea id="description" rows="8"></textarea><label id="photoLabel"></label><input id="photo" type="file" accept="image/*" capture="environment"><p id="photoNote" class="small"></p><button id="submitBtn"></button><p id="submitMsg" class="small"></p></section>
<section id="resultCard" class="card hidden"><div id="status" class="status"></div><p id="instruction"></p><p id="finding" class="small"></p><button id="ackBtn"></button></section>
<section id="doneCard" class="card green hidden"><h2 id="doneTitle"></h2><p id="doneText"></p><button id="doneHomeBtn" class="secondary"></button></section>
<section id="managerCard" class="hidden">
  <div class="card"><h2 id="managerHello"></h2><div id="managerAlert" class="alert-banner hidden"></div><button id="refreshQueue" class="secondary"></button><div id="queue"></div></div>
  <div id="managerDetail" class="card hidden">
    <button id="managerHomeBtn" class="secondary"></button><h2 id="detailTitle"></h2><div id="detailText"></div><button id="mgrAckBtn"></button>
    <div id="postAck" class="hidden"><h3 id="responseTitle"></h3><button id="takeBtn"></button><button id="assignBtn" class="secondary"></button><button id="escalateBtn" class="danger"></button>
      <div id="takePanel" class="card hidden"><h3 id="takeTitle"></h3><label id="actionPlanLabel"></label><textarea id="actionPlan" rows="4"></textarea><div class="row"><div><label id="startLabel"></label><input id="plannedStart" type="datetime-local"></div><div><label id="completeLabel"></label><input id="plannedComplete" type="datetime-local"></div></div><div id="editReasonWrap" class="hidden"><label id="editReasonLabel"></label><textarea id="editReason" rows="2"></textarea></div><button id="confirmTake"></button></div>
      <div id="assignPanel" class="card hidden"><h3 id="assignTitle"></h3><label id="assignToLabel"></label><select id="assignee"></select><label id="handoffLabel"></label><textarea id="handoffNote" rows="3"></textarea><button id="confirmAssign"></button></div>
      <div id="escalatePanel" class="card hidden"><h3 id="escalateTitle"></h3><label id="reasonLabel"></label><textarea id="escalateReason" rows="3"></textarea><button id="confirmEscalate" class="danger"></button></div>
    </div><p id="managerMsg" class="small"></p>
  </div>
</section>
<button id="helpBtn" class="help hidden"></button><div id="helpModal" class="modal hidden"><div class="card"><h2 id="helpTitle"></h2><div id="helpBody"></div><button id="closeHelpBtn"></button></div></div>
</main>
<script src="app-v10.js?v=10"></script>
</body></html>
