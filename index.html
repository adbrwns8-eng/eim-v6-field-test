<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EIM v6 Field Test</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f8;color:#17202a}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:24px;margin:0 0 6px}.test{font-weight:700;color:#9b1c1c;margin-bottom:14px}.hidden{display:none!important}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:13px;margin:7px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:700;min-height:46px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#475467}.danger{background:#b42318}.green{background:#e7f7eb}.yellow{background:#fff4cc}.red{background:#ffe0e0}.small{font-size:13px;color:#5d6673}.status{font-weight:800;font-size:22px}.queue-item{border:1px solid #d0d5dd;border-radius:10px;padding:14px;margin:10px 0;background:#fff}.queue-item.new-assignment{border:2px solid #b54708;background:#fff7ed}.queue-item.owned{border:2px solid #1a7f37;background:#eefaf1}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px;background:#eef2f6}.new-badge,.owned-badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:800;font-size:12px;color:#fff;margin-bottom:8px}.new-badge{background:#b54708}.owned-badge{background:#1a7f37}.alert-banner{border:2px solid #b54708;background:#fff7ed;border-radius:12px;padding:16px;margin:0 0 14px;font-weight:700}.alert-banner strong{display:block;font-size:20px;margin-bottom:4px}.row{display:flex;gap:10px}.row>*{flex:1}.mission{border-left:4px solid #17202a;padding-left:14px}.commit{font-weight:700}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.help{position:fixed;right:18px;bottom:18px;width:auto;padding:12px 18px;border-radius:999px;box-shadow:0 3px 12px #0003;z-index:4}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal .card{max-width:520px;width:100%;max-height:80vh;overflow:auto}.owner-box{background:#f7f8fa;border:1px solid #d0d5dd;border-radius:10px;padding:14px;margin:12px 0}.langbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.langbar button{width:auto;margin:0;min-height:38px;padding:8px 14px;background:#fff;color:#17202a}.langbar button.active{background:#17202a;color:#fff}.ack-section{border:1px solid #d0d5dd;border-radius:12px;padding:16px;margin:14px 0;background:#fafafa}.ack-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:700}.ack-row input{width:22px;height:22px;margin:0;accent-color:#1a7f37;flex:0 0 auto}.ack-complete{border-color:#1a7f37;background:#eefaf1}.initials-wrap{margin-top:16px}.initials-wrap input{text-transform:uppercase;max-width:180px}.first-login-note{background:#eef2f6;border-radius:10px;padding:12px;font-size:14px}.manager-error{color:#b42318;font-weight:700}.manager-ok{color:#1a7f37;font-weight:700}@media(max-width:640px){.row,.tiles{display:block}}
</style>
</head>
<body><main>
<div class="langbar"><button id="langEn">English</button><button id="langEs">Español</button></div>
<h1>ENERGY IN MOTION</h1><div id="testBanner" class="test"></div>
<section id="loginCard" class="card"><h2 id="accessTitle"></h2><input id="pin" inputmode="numeric" pattern="[0-9]*" placeholder="PIN"><button id="loginBtn"></button><p id="loginMsg" class="small"></p><p id="testPins" class="small"></p></section>
<section id="welcomeCard" class="card hidden"><h2 id="welcomeName"></h2><p id="firstLoginNote" class="first-login-note"></p><div id="ack1" class="ack-section"><h3 id="ack1Title"></h3><div id="roleMessage"></div><label class="ack-row"><input id="ackRole" type="checkbox"><span id="ack1CheckText"></span></label></div><div id="ack2" class="ack-section"><h3 id="ack2Title"></h3><div id="missionBlock" class="mission"></div><label class="ack-row"><input id="ackMission" type="checkbox"><span id="ack2CheckText"></span></label></div><div id="ack3" class="ack-section"><h3 id="ack3Title"></h3><p id="systemPurpose"></p><p id="helpReminder"></p><label class="ack-row"><input id="ackReporting" type="checkbox"><span id="ack3CheckText"></span></label></div><div class="initials-wrap"><label id="initialsLabel" for="initials"></label><input id="initials" maxlength="10" autocomplete="off"><p id="ackMsg" class="small"></p></div><button id="welcomeContinue" disabled></button></section>
<section id="employeeHome" class="card hidden"><h2 id="employeeHomeName"></h2><p id="homeQuestion"></p><div class="tiles"><button id="vehicleBtn"></button><button id="plantBtn"></button><button id="workBtn"></button><button id="incidentBtn" class="danger"></button></div><p id="homeNote" class="small"></p></section>
<section id="employeeCard" class="card hidden"><button id="inspectionHomeBtn" class="secondary"></button><h2 id="inspectionTitle"></h2><h3 id="hello"></h3><label id="equipmentLabel"></label><select id="equipment"></select><label id="descLabel"></label><textarea id="description" rows="8"></textarea><label id="photoLabel"></label><input id="photo" type="file" accept="image/*" capture="environment"><p id="photoNote" class="small"></p><button id="submitBtn"></button><p id="submitMsg" class="small"></p></section>
<section id="resultCard" class="card hidden"><div id="status" class="status"></div><p id="instruction"></p><p id="finding" class="small"></p><button id="ackBtn"></button></section>
<section id="doneCard" class="card green hidden"><h2 id="doneTitle"></h2><p id="doneText"></p><button id="doneHomeBtn" class="secondary"></button></section>
<section id="managerCard" class="hidden"><div class="card"><h2 id="managerHello"></h2><div id="managerAlert" class="alert-banner hidden"></div><button id="refreshQueue" class="secondary"></button><div id="queue"></div></div><div id="managerDetail" class="card hidden"><button id="managerHomeBtn" class="secondary"></button><h2 id="detailTitle"></h2><div id="detailText"></div><button id="mgrAckBtn"></button><div id="postAck" class="hidden"><h3 id="responseTitle"></h3><button id="takeBtn"></button><button id="assignBtn" class="secondary"></button><button id="escalateBtn" class="danger"></button><div id="takePanel" class="card hidden"><h3 id="takeTitle"></h3><label id="actionPlanLabel"></label><textarea id="actionPlan" rows="4"></textarea><div class="row"><div><label id="startLabel"></label><input id="plannedStart" type="datetime-local"></div><div><label id="completeLabel"></label><input id="plannedComplete" type="datetime-local"></div></div><button id="confirmTake"></button></div><div id="assignPanel" class="card hidden"><h3 id="assignTitle"></h3><label id="assignToLabel"></label><select id="assignee"></select><label id="handoffLabel"></label><textarea id="handoffNote" rows="3"></textarea><button id="confirmAssign"></button></div><div id="escalatePanel" class="card hidden"><h3 id="escalateTitle"></h3><label id="reasonLabel"></label><textarea id="escalateReason" rows="3"></textarea><button id="confirmEscalate" class="danger"></button></div></div><p id="managerMsg" class="small"></p></div></section>
<button id="helpBtn" class="help hidden"></button><div id="helpModal" class="modal hidden"><div class="card"><h2 id="helpTitle"></h2><div id="helpBody"></div><button id="closeHelpBtn"></button></div></div>
</main>
<script>
const API_BASE='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';
const ONBOARD_VERSION='welcome-v1';
let employee=null,manager=null,findingId=null,currentFinding=null,inspectionType=null;
let lang=localStorage.getItem('eimLang')||'en';
const $=id=>document.getElementById(id);
const T={
 en:{test:'EIM FIELD TEST — v6<br>TEST ENVIRONMENT — NOT PRODUCTION',access:'Access',continue:'CONTINUE',pins:'Employee test PIN: 1111 · Manager test PIN: 2222 · On-Site Manager: 3333',checking:'Checking PIN...',badpin:'PIN not recognized.',connection:'Connection error: ',welcome:'Welcome, ',firstLogin:'First-time introduction. Read and acknowledge each section before continuing. This page will not appear on every login.',ack1Title:'1. Your Role & Responsibility',ack2Title:'2. EIM Mission & Commitment',ack3Title:'3. Reporting & System Expectations',readAck:'✓ I have read and understand this section.',initials:'Employee initials',completeAck:'COMPLETE ACKNOWLEDGMENT & CONTINUE',mission:'<p><b>Our Mission</b><br>To operate safely, responsibly, and efficiently while building a culture of accountability, continuous improvement, and operational excellence.</p><p><b>Our Commitment</b></p><p class="commit">“What we train establishes the expectation. What we reinforce creates the behavior. What leadership repeatedly allows becomes the culture.”</p>',helpReminder:'When you are unsure, stop and ask. The Help button is available throughout the app.',homeQuestion:'What do you need to do?',vehicle:'VEHICLE / MOBILE EQUIPMENT INSPECTION',plant:'PLANT INSPECTION',work:'WORK AREA INSPECTION',incident:'REPORT AN INCIDENT',homeNote:'Inspection categories will be connected to the appropriate equipment and area lists as the pilot expands.',home:'HOME',equipment:'Equipment',desc:'Test deficiency description',defaultDesc:'During the inspection I noticed the access step handrail is loose and moves when pressure is applied. The mounting point appears worn. I am concerned someone could lose their balance while climbing onto the equipment.',photo:'Test photo',photoNote:'For this pilot, any harmless test photo is acceptable.',submit:'SUBMIT TEST DEFICIENCY',needPhoto:'Select a harmless test photo.',ack:'I UNDERSTAND',doneTitle:'✓ Test Report Submitted',doneText:'Your instruction acknowledgement has been recorded.',queue:'Management Queue',refresh:'REFRESH FINDINGS',loading:'Loading...',newAssignment:'NEW ASSIGNMENT',newAssignments:'NEW ASSIGNMENTS',ownedBadge:'OWNED / ACCEPTED',attention:'Requires your attention. Open the finding below to review the handoff and respond.',noFindings:'No open findings or assignments.',openFinding:'OPEN FINDING',handoff:'Handoff',from:'from',detail:'Finding Detail',finding:'Finding',severity:'Severity',status:'Status',actionStatus:'Action Status',ackFinding:'ACKNOWLEDGE FINDING',response:'Choose Response',take:'TAKE OWNERSHIP',assign:'ASSIGN / TRANSFER',escalate:'ESCALATE',takeTitle:'Take Ownership',actionPlan:'Action plan',start:'Planned start',complete:'Planned completion',confirmTake:'CONFIRM OWNERSHIP',assignTitle:'Assign / Transfer',assignTo:'Assign to',handoffNote:'Handoff note',confirmAssign:'CONFIRM ASSIGNMENT',escalateTitle:'Escalate',reason:'Reason',confirmEscalate:'CONFIRM ESCALATION',opened:'Finding opened and timestamped.',openFailed:'Finding opened locally, but the audit timestamp could not be saved: ',acknowledged:'Acknowledged. Choose ownership, transfer, or escalation.',required:'Action plan, start, and completion are required.',owned:'Ownership accepted and corrective action plan recorded.',alreadyOwned:'This finding is already owned by you. You may transfer or escalate it.',transferred:'Finding assigned/transferred and recorded.',reasonRequired:'Escalation reason is required.',escalated:'Management escalation recorded.',help:'? HELP',helpTitle:'Help',helpBody:'<p><b>Not sure what to do?</b> Stop and ask your supervisor or manager. Do not guess about equipment condition or operating authorization.</p><p><b>Reporting:</b> Describe what you actually observe. Use clear facts and a useful photo when required.</p>',closeHelp:'CLOSE HELP',incidentMsg:'Incident reporting is queued for the next pilot module.',vehicleTitle:'Vehicle / Mobile Equipment Inspection',plantTitle:'Plant Inspection',workTitle:'Work Area Inspection'},
 es:{test:'PRUEBA DE CAMPO EIM — v6<br>ENTORNO DE PRUEBA — NO ES PRODUCCIÓN',access:'Acceso',continue:'CONTINUAR',pins:'PIN empleado: 1111 · Gerente: 2222 · Gerente en sitio: 3333',checking:'Verificando PIN...',badpin:'PIN no reconocido.',connection:'Error de conexión: ',welcome:'Bienvenido, ',firstLogin:'Introducción de primer ingreso. Lea y confirme cada sección antes de continuar.',ack1Title:'1. Su Función y Responsabilidad',ack2Title:'2. Misión y Compromiso de EIM',ack3Title:'3. Expectativas de Reporte y del Sistema',readAck:'✓ He leído y entiendo esta sección.',initials:'Iniciales del empleado',completeAck:'COMPLETAR CONFIRMACIÓN Y CONTINUAR',mission:'<p><b>Nuestra Misión</b><br>Operar de manera segura, responsable y eficiente mientras construimos una cultura de responsabilidad, mejora continua y excelencia operacional.</p>',helpReminder:'Cuando no esté seguro, deténgase y pregunte.',homeQuestion:'¿Qué necesita hacer?',vehicle:'INSPECCIÓN DE VEHÍCULO / EQUIPO MÓVIL',plant:'INSPECCIÓN DE PLANTA',work:'INSPECCIÓN DEL ÁREA DE TRABAJO',incident:'REPORTAR UN INCIDENTE',homeNote:'Las categorías se conectarán con las listas correspondientes a medida que se amplíe la prueba.',home:'INICIO',equipment:'Equipo',desc:'Descripción de la deficiencia de prueba',defaultDesc:'Durante la inspección noté que el pasamanos del escalón de acceso está flojo y se mueve cuando se aplica presión.',photo:'Foto de prueba',photoNote:'Para esta prueba piloto, cualquier foto segura es aceptable.',submit:'ENVIAR DEFICIENCIA DE PRUEBA',needPhoto:'Seleccione una foto de prueba.',ack:'ENTIENDO',doneTitle:'✓ Reporte de Prueba Enviado',doneText:'Se registró su confirmación.',queue:'Cola de Administración',refresh:'ACTUALIZAR HALLAZGOS',loading:'Cargando...',newAssignment:'NUEVA ASIGNACIÓN',newAssignments:'NUEVAS ASIGNACIONES',ownedBadge:'ASUMIDO / ACEPTADO',attention:'Requiere su atención. Abra el hallazgo para responder.',noFindings:'No hay hallazgos ni asignaciones abiertas.',openFinding:'ABRIR HALLAZGO',handoff:'Transferencia',from:'de',detail:'Detalle del Hallazgo',finding:'Hallazgo',severity:'Severidad',status:'Estado',actionStatus:'Estado de Acción',ackFinding:'CONFIRMAR HALLAZGO',response:'Seleccione una Respuesta',take:'ASUMIR RESPONSABILIDAD',assign:'ASIGNAR / TRANSFERIR',escalate:'ESCALAR',takeTitle:'Asumir Responsabilidad',actionPlan:'Plan de acción',start:'Inicio planeado',complete:'Finalización planeada',confirmTake:'CONFIRMAR RESPONSABILIDAD',assignTitle:'Asignar / Transferir',assignTo:'Asignar a',handoffNote:'Nota de transferencia',confirmAssign:'CONFIRMAR ASIGNACIÓN',escalateTitle:'Escalar',reason:'Motivo',confirmEscalate:'CONFIRMAR ESCALAMIENTO',opened:'Hallazgo abierto y hora registrada.',openFailed:'El hallazgo se abrió, pero no se pudo guardar la hora: ',acknowledged:'Confirmado. Seleccione responsabilidad, transferencia o escalamiento.',required:'Se requieren el plan de acción, inicio y finalización.',owned:'Responsabilidad aceptada y plan registrado.',alreadyOwned:'Este hallazgo ya está bajo su responsabilidad. Puede transferirlo o escalarlo.',transferred:'Hallazgo asignado/transferido y registrado.',reasonRequired:'Se requiere el motivo.',escalated:'Escalamiento registrado.',help:'? AYUDA',helpTitle:'Ayuda',helpBody:'<p>Si no está seguro, deténgase y pregunte a su supervisor o gerente.</p>',closeHelp:'CERRAR AYUDA',incidentMsg:'El reporte de incidentes está previsto para el próximo módulo.',vehicleTitle:'Inspección de Vehículo / Equipo Móvil',plantTitle:'Inspección de Planta',workTitle:'Inspección del Área de Trabajo'}
};
const tr=()=>T[lang];
const isManagement=d=>['manager','admin','lead_supervisor'].includes(d.access_level);
function roleCopy(d){const r=d.role||'Employee';return lang==='es'?`<p><b>Rol: ${r}</b></p><p>Su responsabilidad es realizar el trabajo para el cual está capacitado y autorizado, completar inspecciones y reportar deficiencias con precisión.</p>`:`<p><b>Role: ${r}</b></p><p>Your responsibility is to perform the work you are trained and authorized to do, complete required inspections, report deficiencies and incidents accurately, follow operating restrictions, and contact supervision whenever conditions are unclear.</p>`}
function purposeCopy(){return lang==='es'?'<b>Su parte en este sistema</b><br>Reporte lo que realmente observa. Sea preciso y honesto.':'<b>Your part in this system</b><br>Report what you actually see. Be accurate and honest.'}
async function api(action,body={}){const r=await fetch(`${API_BASE}?a=${encodeURIComponent(action)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch{}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function getList(action){const r=await fetch(`${API_BASE}?a=${encodeURIComponent(action)}`);const tx=await r.text();let d=[];try{d=tx?JSON.parse(tx):[]}catch{}if(!r.ok)throw new Error(d.error||'Load failed');return d}
function setMsg(text,ok=false){$('managerMsg').className=ok?'small manager-ok':'small manager-error';$('managerMsg').textContent=text||''}
function updateAckState(){const ok=$('ackRole').checked&&$('ackMission').checked&&$('ackReporting').checked&&$('initials').value.trim();$('welcomeContinue').disabled=!ok;[['ack1','ackRole'],['ack2','ackMission'],['ack3','ackReporting']].forEach(([a,b])=>$(a).classList.toggle('ack-complete',$(b).checked))}
function applyLanguage(){const t=tr();document.documentElement.lang=lang;$('langEn').classList.toggle('active',lang==='en');$('langEs').classList.toggle('active',lang==='es');$('testBanner').innerHTML=t.test;$('accessTitle').textContent=t.access;$('loginBtn').textContent=t.continue;$('testPins').textContent=t.pins;$('firstLoginNote').textContent=t.firstLogin;$('ack1Title').textContent=t.ack1Title;$('ack2Title').textContent=t.ack2Title;$('ack3Title').textContent=t.ack3Title;$('ack1CheckText').textContent=t.readAck;$('ack2CheckText').textContent=t.readAck;$('ack3CheckText').textContent=t.readAck;$('initialsLabel').textContent=t.initials;$('welcomeContinue').textContent=t.completeAck;$('missionBlock').innerHTML=t.mission;$('helpReminder').textContent=t.helpReminder;$('homeQuestion').textContent=t.homeQuestion;$('vehicleBtn').textContent=t.vehicle;$('plantBtn').textContent=t.plant;$('workBtn').textContent=t.work;$('incidentBtn').textContent=t.incident;$('homeNote').textContent=t.homeNote;$('inspectionHomeBtn').textContent='← '+t.home;$('equipmentLabel').textContent=t.equipment;$('descLabel').textContent=t.desc;$('photoLabel').textContent=t.photo;$('photoNote').textContent=t.photoNote;$('submitBtn').textContent=t.submit;$('ackBtn').textContent=t.ack;$('doneTitle').textContent=t.doneTitle;$('doneText').textContent=t.doneText;$('doneHomeBtn').textContent=t.home;$('refreshQueue').textContent=t.refresh;$('managerHomeBtn').textContent='← '+t.home;$('detailTitle').textContent=t.detail;$('mgrAckBtn').textContent=t.ackFinding;$('responseTitle').textContent=t.response;$('takeBtn').textContent=t.take;$('assignBtn').textContent=t.assign;$('escalateBtn').textContent=t.escalate;$('takeTitle').textContent=t.takeTitle;$('actionPlanLabel').textContent=t.actionPlan;$('startLabel').textContent=t.start;$('completeLabel').textContent=t.complete;$('confirmTake').textContent=t.confirmTake;$('assignTitle').textContent=t.assignTitle;$('assignToLabel').textContent=t.assignTo;$('handoffLabel').textContent=t.handoffNote;$('confirmAssign').textContent=t.confirmAssign;$('escalateTitle').textContent=t.escalateTitle;$('reasonLabel').textContent=t.reason;$('confirmEscalate').textContent=t.confirmEscalate;$('helpBtn').textContent=t.help;$('helpTitle').textContent=t.helpTitle;$('helpBody').innerHTML=t.helpBody;$('closeHelpBtn').textContent=t.closeHelp;if(employee){$('welcomeName').textContent=t.welcome+employee.name;$('roleMessage').innerHTML=roleCopy(employee);$('systemPurpose').innerHTML=purposeCopy();if(isManagement(employee))$('managerHello').textContent=t.welcome+employee.name+' — '+t.queue;else $('employeeHomeName').textContent=t.welcome+employee.name}}
function setLanguage(v){lang=v;localStorage.setItem('eimLang',v);applyLanguage();if(manager&&!$('managerCard').classList.contains('hidden'))loadQueue()}
async function routeHome(){$('welcomeCard').classList.add('hidden');if(isManagement(employee)){$('managerCard').classList.remove('hidden');await loadAssignees();await loadQueue()}else{$('employeeHome').classList.remove('hidden')}}
async function loadEquipment(){const data=await getList('equipment');$('equipment').innerHTML=data.map(x=>`<option value="${x.id}">${x.equipment_id} — ${x.description}</option>`).join('')}
async function loadAssignees(){const data=await getList('assignees');$('assignee').innerHTML=data.map(x=>`<option value="${x.id}">${x.name} — ${x.role}</option>`).join('')}
async function chooseInspection(type){inspectionType=type;$('employeeHome').classList.add('hidden');$('employeeCard').classList.remove('hidden');$('inspectionTitle').textContent=type==='vehicle'?tr().vehicleTitle:type==='plant'?tr().plantTitle:tr().workTitle;$('hello').textContent=employee.name;$('description').value=tr().defaultDesc;await loadEquipment()}
function backHome(){$('employeeCard').classList.add('hidden');$('employeeHome').classList.remove('hidden')}
function goHome(){$('resultCard').classList.add('hidden');$('doneCard').classList.add('hidden');$('employeeCard').classList.add('hidden');$('employeeHome').classList.remove('hidden')}
function managerHome(){$('managerDetail').classList.add('hidden');$('postAck').classList.add('hidden');$('takePanel').classList.add('hidden');$('assignPanel').classList.add('hidden');$('escalatePanel').classList.add('hidden');currentFinding=null;setMsg('');loadQueue()}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadQueue(){const t=tr();$('queue').innerHTML=`<p>${t.loading}</p>`;$('managerAlert').classList.add('hidden');try{const data=await api('manager_queue',{manager_id:manager.employee_id});window._queue=Array.isArray(data)?data:[];const newItems=window._queue.filter(x=>x.assigned_to===manager.employee_id&&x.finding_status==='assigned'&&x.corrective_status==='assigned');if(newItems.length){$('managerAlert').innerHTML=`<strong>${newItems.length} ${newItems.length===1?t.newAssignment:t.newAssignments}</strong>${t.attention}`;$('managerAlert').classList.remove('hidden')}$('queue').innerHTML=window._queue.length?window._queue.map(x=>{const isNew=x.assigned_to===manager.employee_id&&x.finding_status==='assigned'&&x.corrective_status==='assigned';const owned=x.assigned_to===manager.employee_id&&x.corrective_status==='accepted';const cls=isNew?' new-assignment':owned?' owned':'';const badge=isNew?`<div class="new-badge">${t.newAssignment}</div>`:owned?`<div class="owned-badge">${t.ownedBadge}</div>`:'';return `<div class="queue-item${cls}">${badge}<div><span class="badge">${escapeHtml(String(x.current_severity||'').toUpperCase())}</span> ${escapeHtml(x.equipment_code||'')} — ${escapeHtml(x.equipment_description||'')}</div><p>${escapeHtml(x.description||'')}</p>${x.handoff_note?`<p><b>${t.handoff}:</b> ${escapeHtml(x.handoff_note)}${x.assigned_by_name?` — ${t.from} ${escapeHtml(x.assigned_by_name)}`:''}</p>`:''}<button type="button" class="open-finding-btn" data-finding-id="${escapeHtml(x.finding_id)}">${t.openFinding}</button></div>`}).join(''):`<p>${t.noFindings}</p>`;$('queue').querySelectorAll('.open-finding-btn').forEach(btn=>btn.addEventListener('click',()=>openFinding(btn.dataset.findingId)))}catch(e){$('queue').innerHTML=`<p class="manager-error">${escapeHtml(t.connection+e.message)}</p>`}}
function renderFindingDetail(){const t=tr(),f=currentFinding;if(!f)return;$('detailText').innerHTML=`<p><b>${t.finding} #${escapeHtml(f.finding_no)}</b></p><p><b>${t.equipment}:</b> ${escapeHtml(f.equipment_code)} — ${escapeHtml(f.equipment_description)}</p><p><b>${t.severity}:</b> ${escapeHtml(String(f.current_severity||'').toUpperCase())}</p><p><b>${t.status}:</b> ${escapeHtml(String(f.finding_status||'').toUpperCase())}</p>${f.corrective_status?`<p><b>${t.actionStatus}:</b> ${escapeHtml(String(f.corrective_status).toUpperCase())}</p>`:''}${f.handoff_note?`<p><b>${t.handoff}:</b> ${escapeHtml(f.handoff_note)}${f.assigned_by_name?` — ${t.from} ${escapeHtml(f.assigned_by_name)}`:''}</p>`:''}<p>${escapeHtml(f.description||'')}</p>`}
async function openFinding(id){const t=tr();currentFinding=(window._queue||[]).find(x=>String(x.finding_id)===String(id));if(!currentFinding){setMsg('Finding could not be located in the current queue.');return}renderFindingDetail();$('managerDetail').classList.remove('hidden');$('managerDetail').scrollIntoView({behavior:'smooth',block:'start'});$('takePanel').classList.add('hidden');$('assignPanel').classList.add('hidden');$('escalatePanel').classList.add('hidden');setMsg('');const alreadyOwned=currentFinding.assigned_to===manager.employee_id&&currentFinding.corrective_status==='accepted';if(alreadyOwned){$('mgrAckBtn').classList.add('hidden');$('postAck').classList.remove('hidden');$('takeBtn').classList.add('hidden');setMsg(t.alreadyOwned,true)}else{$('mgrAckBtn').classList.remove('hidden');$('postAck').classList.add('hidden');$('takeBtn').classList.remove('hidden')}try{await api('manager_open',{manager_id:manager.employee_id,finding_id:id});if(!alreadyOwned)setMsg(t.opened,true)}catch(e){setMsg(t.openFailed+e.message)}}
$('langEn').onclick=()=>setLanguage('en');$('langEs').onclick=()=>setLanguage('es');[$('ackRole'),$('ackMission'),$('ackReporting'),$('initials')].forEach(x=>x.addEventListener('input',updateAckState));
$('loginBtn').onclick=async()=>{$('loginBtn').disabled=true;$('loginMsg').textContent=tr().checking;try{const d=await api('login',{pin:$('pin').value.trim()});if(!d.ok){$('loginMsg').textContent=tr().badpin;return}employee=d;if(isManagement(d))manager=d;$('loginCard').classList.add('hidden');$('helpBtn').classList.remove('hidden');applyLanguage();const s=await api('onboarding_status',{employee_id:d.employee_id,version:ONBOARD_VERSION});if(Array.isArray(s)&&s.length&&s[0].completed)await routeHome();else{$('ackRole').checked=$('ackMission').checked=$('ackReporting').checked=false;$('initials').value='';updateAckState();$('welcomeCard').classList.remove('hidden')}}catch(e){$('loginMsg').textContent=tr().connection+e.message}finally{$('loginBtn').disabled=false}};
$('welcomeContinue').onclick=async()=>{if($('welcomeContinue').disabled)return;$('welcomeContinue').disabled=true;try{await api('complete_onboarding',{employee_id:employee.employee_id,version:ONBOARD_VERSION,language:lang,initials:$('initials').value.trim()});await routeHome()}catch(e){$('ackMsg').textContent=tr().connection+e.message;updateAckState()}};
$('vehicleBtn').onclick=()=>chooseInspection('vehicle');$('plantBtn').onclick=()=>chooseInspection('plant');$('workBtn').onclick=()=>chooseInspection('work_area');$('incidentBtn').onclick=()=>alert(tr().incidentMsg);$('inspectionHomeBtn').onclick=backHome;$('doneHomeBtn').onclick=goHome;$('managerHomeBtn').onclick=managerHome;$('refreshQueue').onclick=loadQueue;$('helpBtn').onclick=()=>$('helpModal').classList.remove('hidden');$('closeHelpBtn').onclick=()=>$('helpModal').classList.add('hidden');
$('submitBtn').onclick=async()=>{if(!$('photo').files.length){$('submitMsg').textContent=tr().needPhoto;return}$('submitBtn').disabled=true;try{const d=await api('submit',{employee_id:employee.employee_id,equipment_id:$('equipment').value,description:$('description').value,photo_note:$('photo').files[0].name});findingId=d.finding_id;$('employeeCard').classList.add('hidden');$('resultCard').classList.remove('hidden');$('status').textContent=`${String(d.instruction_level).toUpperCase()} — ${String(d.severity).toUpperCase()}`;$('instruction').textContent=d.instruction;$('finding').textContent=`${tr().finding} ID: ${d.finding_id}`}catch(e){$('submitMsg').textContent=e.message}finally{$('submitBtn').disabled=false}};
$('ackBtn').onclick=async()=>{await api('ack',{finding_id:findingId});$('resultCard').classList.add('hidden');$('doneCard').classList.remove('hidden')};
$('mgrAckBtn').onclick=async()=>{try{await api('manager_ack',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id});$('mgrAckBtn').classList.add('hidden');$('postAck').classList.remove('hidden');setMsg(tr().acknowledged,true)}catch(e){setMsg(tr().connection+e.message)}};
$('takeBtn').onclick=()=>{$('takePanel').classList.toggle('hidden');$('assignPanel').classList.add('hidden');$('escalatePanel').classList.add('hidden')};$('assignBtn').onclick=()=>{$('assignPanel').classList.toggle('hidden');$('takePanel').classList.add('hidden');$('escalatePanel').classList.add('hidden')};$('escalateBtn').onclick=()=>{$('escalatePanel').classList.toggle('hidden');$('takePanel').classList.add('hidden');$('assignPanel').classList.add('hidden')};
$('confirmTake').onclick=async()=>{if(!$('actionPlan').value||!$('plannedStart').value||!$('plannedComplete').value){setMsg(tr().required);return}$('confirmTake').disabled=true;try{await api('take_ownership',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,action_plan:$('actionPlan').value,planned_start_at:new Date($('plannedStart').value).toISOString(),planned_complete_at:new Date($('plannedComplete').value).toISOString()});setMsg(tr().owned,true);await loadQueue();currentFinding=(window._queue||[]).find(x=>x.finding_id===currentFinding.finding_id)||currentFinding;renderFindingDetail();$('takePanel').classList.add('hidden');$('takeBtn').classList.add('hidden')}catch(e){setMsg(tr().connection+e.message)}finally{$('confirmTake').disabled=false}};
$('confirmAssign').onclick=async()=>{$('confirmAssign').disabled=true;try{await api('assign_transfer',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,assignee_id:$('assignee').value,note:$('handoffNote').value||'Pilot transfer'});setMsg(tr().transferred,true);$('managerDetail').classList.add('hidden');await loadQueue()}catch(e){setMsg(tr().connection+e.message)}finally{$('confirmAssign').disabled=false}};
$('confirmEscalate').onclick=async()=>{if(!$('escalateReason').value){setMsg(tr().reasonRequired);return}$('confirmEscalate').disabled=true;try{await api('escalate',{manager_id:manager.employee_id,finding_id:currentFinding.finding_id,reason:$('escalateReason').value});setMsg(tr().escalated,true);$('managerDetail').classList.add('hidden');await loadQueue()}catch(e){setMsg(tr().connection+e.message)}finally{$('confirmEscalate').disabled=false}};
applyLanguage();
</script>
</body></html>
