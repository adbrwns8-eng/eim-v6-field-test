<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EIM Test 3 Corrective Action</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:12px;margin:6px 0;border:1px solid #b8c0cc;border-radius:10px}button{background:#17202a;color:#fff;font-weight:700}.secondary{background:#475467}.hidden{display:none}.small{font-size:13px;color:#667085}.ok{background:#e7f7eb;padding:12px;border-radius:10px}.warn{background:#fff4cc;padding:12px;border-radius:10px}.history{border-left:4px solid #667085;padding-left:12px;margin:12px 0}.row{display:flex;gap:10px}.row>*{flex:1}@media(max-width:640px){.row{display:block}}</style></head><body><main><h1>ENERGY IN MOTION</h1><b style="color:#9b1c1c">FIELD TEST — TEST #3 CORRECTIVE ACTION</b>
<section class="card" id="login"><h2>Manager Access</h2><input id="pin" inputmode="numeric" placeholder="Manager PIN (2222 or 3333)"><input id="fid" value="5750f826-28d7-44a4-a9bf-2692b71abce8" placeholder="Finding ID"><button onclick="start()">OPEN CORRECTIVE ACTION</button><p id="loginMsg" class="small"></p></section>
<section id="work" class="hidden"><div class="card"><h2 id="who"></h2><div id="current"></div></div><div class="card"><h2>Update Corrective Action</h2><label>Action plan</label><textarea id="plan" rows="4"></textarea><div class="row"><div><label>Planned start</label><input id="startAt" type="datetime-local"></div><div><label>Planned completion</label><input id="completeAt" type="datetime-local"></div></div><label>Work status</label><select id="progress"><option>Accepted</option><option>Assessing</option><option>Waiting on Parts / Materials</option><option>Repair in Progress</option><option>Ready for Verification</option></select><label>Operational status</label><select id="operational"><option value="green">GREEN — Normal Operation</option><option value="yellow">YELLOW — Restricted Operation</option><option value="red">RED — Out of Service / Do Not Operate</option></select><label>Parts / materials / maintenance note</label><textarea id="materials" rows="3" placeholder="Example: Waiting on steel plate and welding rods"></textarea><label>Reason for this revision *</label><textarea id="reason" rows="3" placeholder="What changed after assessment or maintenance review?"></textarea><button onclick="saveUpdate()">SAVE REVISION</button><p id="updateMsg" class="small"></p></div>
<div class="card"><h2>Photo Evidence</h2><p class="small">Use 1–2 useful photos. Managers may upload a photo taken by maintenance or another employee. The uploader and actual photo source are recorded separately.</p><label>Evidence type</label><select id="etype"><option value="progress">Progress</option><option value="after">After Repair</option><option value="before">Before</option></select><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><label>Who actually took the photo?</label><input id="takenBy" placeholder="Employee / maintenance person name"><label>Source / repair note</label><textarea id="sourceNote" rows="3" placeholder="Example: Photo sent by maintenance after handrail repair"></textarea><button onclick="uploadPhoto()">UPLOAD EVIDENCE</button><p id="photoMsg" class="small"></p></div><div class="card"><h2>Revision & Evidence History</h2><div id="history"></div></div></section>
<script>const API='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';let mgr=null,finding=null,detail=null;async function post(a,b){let r=await fetch(API+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function localDT(s){if(!s)return'';let d=new Date(s),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}async function start(){try{let d=await post('login',{pin:document.getElementById('pin').value});let u=Array.isArray(d)?d[0]:d;if(!u||!u.is_manager)throw new Error('Manager PIN required');mgr=u;finding=document.getElementById('fid').value.trim();document.getElementById('who').textContent='Hello, '+u.first_name+' '+u.last_name;document.getElementById('login').classList.add('hidden');document.getElementById('work').classList.remove('hidden');await load()}catch(e){document.getElementById('loginMsg').textContent=e.message}}async function load(){detail=await post('corrective_detail',{manager_id:mgr.id,finding_id:finding});document.getElementById('plan').value=detail.action_plan||'';document.getElementById('startAt').value=localDT(detail.planned_start_at);document.getElementById('completeAt').value=localDT(detail.planned_complete_at);document.getElementById('current').innerHTML='<p><b>Current status:</b> '+(detail.status||'')+'</p><p><b>Current plan:</b> '+(detail.action_plan||'')+'</p><p><b>Planned completion:</b> '+(detail.planned_complete_at?new Date(detail.planned_complete_at).toLocaleString():'')+'</p>';let h='';(detail.revisions||[]).forEach(r=>h+='<div class="history"><b>'+new Date(r.created_at).toLocaleString()+' — '+r.revised_by+'</b><br>'+esc(r.revision_reason)+'<br><span class="small">Status: '+esc(r.progress_status||'')+' · Operational: '+esc(r.operational_status||'')+'<br>Plan: '+esc(r.action_plan||'')+'<br>Materials: '+esc(r.materials_note||'')+'</span></div>');(detail.evidence||[]).forEach(e=>h+='<div class="history"><b>PHOTO — '+esc((e.evidence_type||'').toUpperCase())+'</b><br>'+new Date(e.created_at).toLocaleString()+' · uploaded by '+esc(e.uploaded_by)+'<br><span class="small">Taken by: '+esc(e.taken_by_name||'Not specified')+' · '+esc(e.source_note||'')+'</span></div>');document.getElementById('history').innerHTML=h||'<p class="small">No revisions or evidence yet.</p>'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function saveUpdate(){let reason=document.getElementById('reason').value.trim();if(!reason){document.getElementById('updateMsg').textContent='Revision reason is required.';return}try{await post('update_corrective',{manager_id:mgr.id,finding_id:finding,action_plan:document.getElementById('plan').value,planned_start_at:new Date(document.getElementById('startAt').value).toISOString(),planned_complete_at:new Date(document.getElementById('completeAt').value).toISOString(),progress_status:document.getElementById('progress').value,operational_status:document.getElementById('operational').value,materials_note:document.getElementById('materials').value,revision_reason:reason});document.getElementById('updateMsg').textContent='✓ Revision saved. Original history preserved.';document.getElementById('reason').value='';await load()}catch(e){document.getElementById('updateMsg').textContent=e.message}}async function uploadPhoto(){let f=document.getElementById('photo').files[0];if(!f){document.getElementById('photoMsg').textContent='Select a photo.';return}document.getElementById('photoMsg').textContent='Preparing photo...';try{let b64=await compress(f);await post('upload_evidence',{manager_id:mgr.id,finding_id:finding,evidence_type:document.getElementById('etype').value,data_base64:b64,mime_type:'image/jpeg',file_name:f.name,taken_by_name:document.getElementById('takenBy').value,source_note:document.getElementById('sourceNote').value});document.getElementById('photoMsg').textContent='✓ Photo evidence uploaded and audit record created.';document.getElementById('photo').value='';await load()}catch(e){document.getElementById('photoMsg').textContent=e.message}}function compress(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78).split(',')[1])};img.onerror=rej;img.src=url})}</script></main></body></html>
