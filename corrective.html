<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Test 3 Corrective Action</title><style>body{font-family:Arial;background:#f4f6f8;color:#17202a;margin:0}main{max-width:760px;margin:auto;padding:20px}.card{background:white;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border:1px solid #b8c0cc;border-radius:9px}button{background:#17202a;color:white;font-weight:bold}.hidden{display:none}.small{color:#667085;font-size:13px}</style></head><body><main><h1>ENERGY IN MOTION</h1><b style="color:#9b1c1c">FIELD TEST — TEST #3 CORRECTIVE ACTION</b><section class="card" id="login"><h2>Manager Access</h2><input id="pin" inputmode="numeric" placeholder="Manager PIN"><input id="fid" placeholder="Finding ID"><button id="openBtn">OPEN CORRECTIVE ACTION</button><p id="msg" class="small">Enter manager PIN and finding ID.</p></section><section id="work" class="hidden"><div class="card"><h2 id="who"></h2><div id="current"></div></div><div class="card"><h2>Update Corrective Action</h2><label>Action plan</label><textarea id="plan" rows="4"></textarea><label>Planned start</label><input id="startAt" type="datetime-local"><label>Planned completion</label><input id="completeAt" type="datetime-local"><label>Work status</label><select id="progress"><option>Accepted</option><option>Assessing</option><option>Waiting on Parts / Materials</option><option>Repair in Progress</option><option>Ready for Verification</option></select><label>Operational status</label><select id="operational"><option value="green">GREEN — Normal Operation</option><option value="yellow">YELLOW — Restricted Operation</option><option value="red">RED — Out of Service / Do Not Operate</option></select><label>Parts / materials / maintenance note</label><textarea id="materials"></textarea><label>Reason for revision</label><textarea id="reason"></textarea><button id="saveBtn">SAVE REVISION</button><p id="saveMsg" class="small"></p></div></section><script>const API='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';let mgr,finding;const $=x=>document.getElementById(x);async function post(a,b){const r=await fetch(API+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function dt(s){if(!s)return'';const d=new Date(s),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}async function load(){const d=await post('corrective_detail',{manager_id:mgr.id,finding_id:finding});$('plan').value=d.action_plan||'';$('startAt').value=dt(d.planned_start_at);$('completeAt').value=dt(d.planned_complete_at);if(d.progress_status)$('progress').value=d.progress_status;$('current').innerHTML='<p><b>Current status:</b> '+(d.status||'')+'</p><p><b>Current plan:</b> '+(d.action_plan||'')+'</p><p><b>Planned completion:</b> '+(d.planned_complete_at?new Date(d.planned_complete_at).toLocaleString():'')+'</p>'}async function openAction(){try{$('msg').textContent='Checking access...';const d=await post('login',{pin:$('pin').value.trim()});const u=Array.isArray(d)?d[0]:d;if(!u||u.ok===false||u.access_level!=='manager')throw Error('Manager PIN required');mgr={id:u.employee_id,name:u.name||'Manager'};finding=$('fid').value.trim();if(!finding)throw Error('Finding ID required');await load();$('who').textContent='Hello, '+mgr.name;$('login').classList.add('hidden');$('work').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}async function save(){const reason=$('reason').value.trim();if(!reason){$('saveMsg').textContent='Revision reason is required.';return}try{await post('update_corrective',{manager_id:mgr.id,finding_id:finding,action_plan:$('plan').value,planned_start_at:$('startAt').value?new Date($('startAt').value).toISOString():null,planned_complete_at:$('completeAt').value?new Date($('completeAt').value).toISOString():null,progress_status:$('progress').value,operational_status:$('operational').value,materials_note:$('materials').value,revision_reason:reason});$('saveMsg').textContent='Revision saved. Original history preserved.';$('reason').value='';await load()}catch(e){$('saveMsg').textContent=e.message}}$('openBtn').onclick=openAction;$('saveBtn').onclick=save;</script></main></body></html>
