<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIM Corrective Action Test</title><style>body{font-family:Arial;background:#f4f6f8;color:#17202a;margin:0}main{max-width:760px;margin:auto;padding:20px}.card{background:white;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border:1px solid #b8c0cc;border-radius:9px}button{background:#17202a;color:white;font-weight:bold}button:disabled{opacity:.55}.hidden{display:none}.small{color:#667085;font-size:13px}.history{border-left:4px solid #667085;padding-left:12px;margin:12px 0}.gate{background:#fff4cc;padding:12px;border-radius:9px}</style></head><body><main><h1>ENERGY IN MOTION</h1><b style="color:#9b1c1c">FIELD TEST — TEST #4 REPAIR → VERIFICATION</b><section class="card" id="login"><h2>Manager Access</h2><input id="pin" inputmode="numeric" placeholder="Manager PIN"><input id="fid" value="5750f826-28d7-44a4-a9bf-2692b71abce8"><button id="openBtn">OPEN CORRECTIVE ACTION</button><p id="msg" class="small"></p></section><section id="work" class="hidden"><div class="card"><h2 id="who"></h2><div id="current"></div></div><div class="card"><h2>Update Corrective Action</h2><label>Action plan</label><textarea id="plan" rows="4"></textarea><label>Planned start</label><input id="startAt" type="datetime-local"><label>Planned completion</label><input id="completeAt" type="datetime-local"><label>Work status</label><select id="progress"><option>Accepted</option><option>Assessing</option><option>Waiting on Parts / Materials</option><option>Repair in Progress</option><option>Ready for Verification</option></select><label>Operational status</label><select id="operational"><option value="">NOT YET SET</option><option value="green">GREEN — Normal Operation</option><option value="yellow">YELLOW — Restricted Operation</option><option value="red">RED — Out of Service / Do Not Operate</option></select><label>Parts / materials / maintenance note</label><textarea id="materials"></textarea><label>Reason for revision</label><textarea id="reason"></textarea><button id="saveBtn">SAVE REVISION</button><p id="saveMsg" class="small"></p></div><div class="card"><h2>Photo Evidence</h2><label>Evidence type</label><select id="etype"><option value="progress">Progress</option><option value="after">After Repair</option><option value="before">Before</option></select><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><label>Who actually took the photo?</label><input id="takenBy"><label>Source / repair note</label><textarea id="sourceNote"></textarea><button id="photoBtn">UPLOAD EVIDENCE</button><p id="photoMsg" class="small"></p></div><div class="card"><h2>Submit Repair for Verification</h2><div id="gate" class="gate"></div><label>Completion / repair description</label><textarea id="completion" rows="4" placeholder="Describe exactly what was repaired and the condition after repair"></textarea><label>Equipment / area status</label><select id="equipStatus"><option value="ready_for_verification">Ready for Verification</option><option value="remain_out_of_service">Remain Out of Service Pending Verification</option></select><button id="submitVerifyBtn">SUBMIT FOR INDEPENDENT VERIFICATION</button><p id="verifyMsg" class="small"></p></div><div class="card"><h2>Revision & Evidence History</h2><div id="history"></div></div></section><script>const API='https://abnydnnafyosrakkgajy.supabase.co/functions/v1/v6-test1-api';let mgr,finding,detail,busy=false;const $=x=>document.getElementById(x);async function post(a,b){const r=await fetch(API+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function dt(s){if(!s)return'';const d=new Date(s),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){detail=await post('corrective_detail',{manager_id:mgr.id,finding_id:finding});$('plan').value=detail.action_plan||'';$('startAt').value=dt(detail.planned_start_at);$('completeAt').value=dt(detail.planned_complete_at);if(detail.progress_status&&[...$('progress').options].some(o=>o.value===detail.progress_status))$('progress').value=detail.progress_status;const revs=detail.revisions||[];if(revs.length){$('operational').value=revs[0].operational_status||'';$('materials').value=revs[0].materials_note||''}$('current').innerHTML='<p><b>Current status:</b> '+esc(detail.status)+'</p><p><b>Current plan:</b> '+esc(detail.action_plan)+'</p>';const ev=detail.evidence||[],after=ev.some(e=>e.evidence_type==='after'||e.evidence_type==='completion_photo');$('gate').innerHTML=after?'<b>✓ AFTER REPAIR PHOTO ON FILE</b><br>Evidence gate satisfied.':'<b>AFTER REPAIR PHOTO REQUIRED</b><br>The system will block submission until an After Repair photo is attached.';$('submitVerifyBtn').disabled=!after;let h='';revs.forEach(r=>h+='<div class="history"><b>REVISION — '+new Date(r.created_at).toLocaleString()+'</b><br>'+esc(r.revision_reason)+'<br><span class="small">By '+esc(r.revised_by)+' · '+esc(r.progress_status)+' · '+esc(r.operational_status)+'<br>'+esc(r.materials_note)+'</span></div>');ev.forEach(e=>h+='<div class="history"><b>PHOTO — '+esc((e.evidence_type||'').toUpperCase())+'</b><br>'+new Date(e.created_at).toLocaleString()+'<br><span class="small">Uploaded by '+esc(e.uploaded_by)+' · Taken by '+esc(e.taken_by_name)+'<br>'+esc(e.source_note)+'</span></div>');$('history').innerHTML=h||'<span class="small">No history.</span>'}async function openAction(){try{const d=await post('login',{pin:$('pin').value.trim()}),u=Array.isArray(d)?d[0]:d;if(!u||u.access_level!=='manager')throw Error('Manager PIN required');mgr={id:u.employee_id,name:u.name};finding=$('fid').value.trim();await load();$('who').textContent='Hello, '+mgr.name;$('login').classList.add('hidden');$('work').classList.remove('hidden')}catch(e){$('msg').textContent=e.message}}async function save(){if(busy)return;const reason=$('reason').value.trim();if(!reason){$('saveMsg').textContent='Revision reason is required.';return}try{busy=true;$('saveBtn').disabled=true;await post('update_corrective',{manager_id:mgr.id,finding_id:finding,action_plan:$('plan').value,planned_start_at:$('startAt').value?new Date($('startAt').value).toISOString():null,planned_complete_at:$('completeAt').value?new Date($('completeAt').value).toISOString():null,progress_status:$('progress').value,operational_status:$('operational').value,materials_note:$('materials').value,revision_reason:reason});$('reason').value='';$('saveMsg').textContent='Revision saved.';await load()}catch(e){$('saveMsg').textContent=e.message}finally{busy=false;$('saveBtn').disabled=false}}function compress(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78).split(',')[1])};img.onerror=rej;img.src=url})}async function photo(){if(busy)return;const f=$('photo').files[0],taken=$('takenBy').value.trim();if(!f){$('photoMsg').textContent='Select a photo.';return}if(!taken){$('photoMsg').textContent='Enter who actually took the photo.';return}try{busy=true;$('photoBtn').disabled=true;const b64=await compress(f);await post('upload_evidence',{manager_id:mgr.id,finding_id:finding,evidence_type:$('etype').value,data_base64:b64,mime_type:'image/jpeg',file_name:f.name,taken_by_name:taken,source_note:$('sourceNote').value.trim()});$('photoMsg').textContent='Photo evidence uploaded.';$('photo').value='';$('takenBy').value='';$('sourceNote').value='';await load()}catch(e){$('photoMsg').textContent=e.message}finally{busy=false;$('photoBtn').disabled=false}}async function submitVerify(){if(busy)return;const comment=$('completion').value.trim();if(!comment){$('verifyMsg').textContent='Completion / repair description is required.';return}try{busy=true;$('submitVerifyBtn').disabled=true;$('submitVerifyBtn').textContent='SUBMITTING...';const d=await post('complete_corrective',{manager_id:mgr.id,finding_id:finding,completion_comment:comment,equipment_status:$('equipStatus').value,file_name:null,request_second_verification:true});$('verifyMsg').textContent='✓ Submitted. Finding is now pending independent verification.';$('submitVerifyBtn').textContent='SUBMITTED FOR VERIFICATION'}catch(e){$('verifyMsg').textContent=e.message;$('submitVerifyBtn').disabled=false;$('submitVerifyBtn').textContent='SUBMIT FOR INDEPENDENT VERIFICATION'}finally{busy=false}}$('openBtn').onclick=openAction;$('saveBtn').onclick=save;$('photoBtn').onclick=photo;$('submitVerifyBtn').onclick=submitVerify;</script></main></body></html>
